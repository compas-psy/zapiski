[package]
name = "zapiski-desktop"
version = "0.1.0"
description = "КОМПАС.ЗАПИСКИ — спокойное приложение для заметок в Markdown"
authors = ["КОМПАС"]
edition = "2021"
rust-version = "1.77.2"
publish = false

# Оболочка Windows (ARCHITECTURE §1): здесь нет ни одного экрана — только
# точка входа, реализация платформенных портов и платформенный манифест.

[lib]
# Имя отличается от имени пакета: `zapiski_desktop` заняло бы имя бинаря.
name = "zapiski_desktop_lib"
crate-type = ["lib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `protocol-asset` — обязателен под `assetProtocol.enable` в tauri.conf.json:
# без него вложения не покажутся в <img src="asset://...">, а tauri-build
# отказывается собирать конфиг, у которого фича не объявлена.
tauri = { version = "2", features = ["tray-icon", "image-png", "protocol-asset"] }
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-store = "2"
tauri-plugin-updater = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-window-state = "2"
tauri-plugin-single-instance = "2"
# Схема `zapiski://`: единственный способ вернуть браузер в приложение после
# входа. Регистрируется установщиком по `tauri.conf.json` → plugins.deep-link.
tauri-plugin-deep-link = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"

# Windows Hello (BiometricProvider) — WinRT KeyCredentialManager плюс
# AES-GCM, которым секрет заворачивается на диске. Всё это существует только
# на Windows, поэтому и зависимости объявлены только для неё: сборка под
# linux (ей проверяется компиляция в этом окружении) их не тянет.
[target.'cfg(windows)'.dependencies]
# Версии совпадают с теми, что тянет сам Tauri 2.11 (`windows` 0.61,
# `webview2-com` 0.38). Это не косметика: COM-объект вебвью приходит из
# tauri/wry, и привести его к `ICoreWebView2_7` можно только типами из той же
# копии крейта — при расхождении версий каст просто не скомпилируется.
windows = { version = "0.61", features = [
  "Foundation",
  "Security_Credentials",
  "Storage_Streams",
  "Win32_Foundation",
] }
webview2-com = "0.38"

# Без этой строки Windows-сборка не компилируется.
# `windows` 0.61 подключает `windows-future` с `default-features = false`,
# а в нём модуль `future` (все `impl IntoFuture`) закрыт под `#[cfg(feature =
# "std")]`. Без него `IAsyncOperation`/`IAsyncAction` не являются футурами,
# и каждый `.await` в hello.rs даёт E0277 «is not a future» — 8 ошибок.
# Унификация фич Cargo включает `std` для всего графа, поэтому hello.rs
# остаётся без изменений.
windows-future = { version = "0.2.1", features = ["std"] }
aes-gcm = "0.10"
sha2 = "0.10"
getrandom = "0.3"

[features]
# Tauri по умолчанию включает devtools в дебаге; в релизе их нет.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
