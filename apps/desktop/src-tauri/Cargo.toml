[package]
name = "zapiski-desktop"
version = "0.1.0"
description = "КОМПАС.ЗАПИСКИ — спокойное приложение для заметок в Markdown"
authors = ["КОМПАС"]
edition = "2021"
rust-version = "1.77.2"
publish = false

# Оболочка Windows (ARCHITECTURE §1): здесь нет ни одного экрана — только
# точка входа, реализация платформенных портов и платформенный манифест.

[lib]
# Имя отличается от имени пакета: `zapiski_desktop` заняло бы имя бинаря.
name = "zapiski_desktop_lib"
crate-type = ["lib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-store = "2"
tauri-plugin-updater = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-window-state = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"

# Windows Hello (BiometricProvider) — WinRT KeyCredentialManager плюс
# AES-GCM, которым секрет заворачивается на диске. Всё это существует только
# на Windows, поэтому и зависимости объявлены только для неё: сборка под
# linux (ей проверяется компиляция в этом окружении) их не тянет.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Foundation",
  "Security_Credentials",
  "Storage_Streams",
] }
aes-gcm = "0.10"
sha2 = "0.10"
getrandom = "0.3"

[features]
# Tauri по умолчанию включает devtools в дебаге; в релизе их нет.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
