<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <!--
      viewport-fit=cover — приложение рисует под вырезом и жестовой полосой,
      отступы берутся из env(safe-area-inset-*) в токенах.
      Масштабирование пользователем НЕ запрещаем: ТЗ §6 требует поддержки
      системного шрифта до 200%, а user-scalable=no ломает эту гарантию.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!--
      `color-scheme` здесь НЕ объявляем: он ставится из темы приложения
      (`packages/ui/src/styles/tokens.css`, привязка к `data-theme`). Пока тут
      стоял `content="light dark"`, системные элементы WebView — кольцо фокуса
      и полосы прокрутки — следовали схеме системы, а не продукта, и в тёмной
      системе вокруг области текста появлялось светлое кольцо: та самая
      «непонятная белая рамка вокруг редактора» из отзыва.
    -->
    <title>ЗАПИСКИ</title>
    <!--
      ЗДЕСЬ НЕ ДОЛЖНО БЫТЬ НИ ОДНОГО <style>. Это не вкусовщина, а условие
      работоспособности редактора, и стоило оно дорого.

      Tauri при сборке дописывает `nonce` КАЖДОМУ <style> в этом файле
      (`tauri-utils`, `inject_nonce(document, "style", STYLE_NONCE_TOKEN)`), а в
      рантайме добавляет `'nonce-…'` в `style-src` отдаваемой WebView политики.
      По спецификации CSP появление nonce ОТМЕНЯЕТ `'unsafe-inline'` — и тогда
      всякий <style>, вставленный из JS, блокируется.

      А из JS у нас оформляют себя и CodeMirror, и панель форматирования: это
      StyleModule, архитектурная данность редактора, а не наш выбор. Пока тут
      стоял единственный блок «фон первого кадра», на устройстве были мертвы
      тема редактора и все стили панели: кнопки рисовались серыми квадратами
      системного вида, таблица показывалась сырым markdown, а вокруг текста
      светилось чужое кольцо фокуса. В вебе и на Windows того же <style> нет —
      поэтому там всё выглядело правильно, и дефект годами читался как
      «Android почему-то не такой».

      Стили оболочки — в `src/shell.css`: он попадает в бандл ссылкой, а
      `style-src 'self'` ссылки разрешает.
    -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
