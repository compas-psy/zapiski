[package]
name = "zapiski-mobile"
version = "0.1.0"
description = "ЗАПИСКИ — спокойное приложение для заметок в Markdown"
authors = ["СИМПАС"]
edition = "2021"
rust-version = "1.77.2"
publish = false

# Оболочка Android (ARCHITECTURE §1): здесь нет ни одного экрана — только
# точка входа, реализация платформенных портов и платформенный манифест.

[lib]
# Имя библиотеки видит и Gradle: `tauri android init` подставляет его в
# `System.loadLibrary`. Менять его без переинициализации gen/android нельзя.
name = "zapiski_mobile_lib"
# cdylib — то, что грузит Android; staticlib нужен tauri-mobile для iOS-цели,
# rlib — чтобы `main.rs` и тесты могли использовать крейт как обычную
# библиотеку (на этом держится `cargo test` под linux).
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `protocol-asset` — обязателен: в `tauri.conf.json` включён `assetProtocol`,
# без которого вложения в заметке нечем показать (`asset://…` в <img>).
# Сборка падает, если фича и конфиг разошлись, — это проверка, а не помеха.
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"

# JNI нужен только на Android: FLAG_SECURE, вибрация, BiometricPrompt, печать,
# скачивание обновления и перерисовка виджетов делаются платформенными API,
# до которых из webview не дотянуться. На хосте (linux, где в этом окружении
# проверяется компиляция) зависимость не тянется совсем — см. `android.rs`,
# там для не-Android объявлены честные заглушки, возвращающие ошибку.
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
