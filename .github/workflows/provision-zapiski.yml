name: Провижн zapiski.cmpas.ru (nginx + TLS)

# ОДНОРАЗОВАЯ (но идемпотентная) подготовка сервера под КОМПАС.ЗАПИСКИ:
# ставит ОТДЕЛЬНЫЙ vhost nginx, выпускает СВОЙ сертификат Let's Encrypt,
# создаёт docroot и пустой каталог /var/www/zapiski под код API.
# Репозиторий на сервер НЕ клонируется: код доставляет rsync'ом сам деплой,
# поэтому серверу не нужен доступ к GitHub (см. шаг 5 ниже).
#
# Это единственный workflow ЗАПИСОК, который вообще подходит к nginx.
# Он намеренно отделён от регулярного деплоя (deploy-zapiski.yml), чтобы
# ежедневная выкладка кода никогда не оказывалась рядом с веб-сервером.
# Запускается сам, только когда меняется что-то в deploy/**, и по кнопке.
#
# ПОЧЕМУ ЭТО НЕ МОЖЕТ СЛОМАТЬ cmpas.ru (ADR-0003 §5, §6):
#   * Мы только СОЗДАЁМ свои файлы: /etc/nginx/sites-available/zapiski.cmpas.ru
#     и симлинк на него. Vhost Дневника не читается, не копируется, не
#     редактируется — его имени нет ни в одной команде ниже.
#   * Порядок жёсткий: включили симлинк → `nginx -t` на ПОЛНОМ конфиге →
#     reload ТОЛЬКО при успехе. Если тест провалился, симлинк снимается,
#     и в sites-enabled остаются исключительно конфиги, проходящие `nginx -t`.
#     Значит ни последующий деплой Дневника, ни автопродление сертификата
#     не унаследуют от нас битый файл.
#   * `systemctl reload nginx` — graceful, без обрыва соединений. Никогда
#     не restart: restart на пару секунд гасит и Дневник тоже.
#   * certbot строго `-d zapiski.cmpas.ru` — правит только наш server-блок,
#     сертификат cmpas.ru не переоформляется. Провал certbot не валит
#     workflow: ЗАПИСКИ остаются на HTTP, Дневник не задет вообще.
#   * Docker-стек, база и почта Дневника здесь не упоминаются ни разу.

# ВЕТКИ. Веткой по умолчанию в этом репозитории является не `main`, а рабочая
# ветка (репозиторий создавался пустым, и default_branch стала первая
# запушенная). Одного `main` в фильтре хватало ровно на то, чтобы провижн не
# запускался НИКОГДА: за всё время он стартовал дважды, и оба раза руками.
#
# Цена этой опечатки оказалась не теоретической. Блоки `location = /terms` и
# `= /privacy` появились в конфиге, доехали в репозиторий, прошли все проверки —
# и остались там: на сервере продолжал работать vhost, выложенный до них.
# Ссылки на документы с экрана входа попадали в SPA-фолбэк и открывали
# приложение, то есть человек ставил галочку «принимаю условия», не имея
# возможности эти условия прочитать.
#
# Имя ветки перечислено буквально: в `on:` выражения не работают. Так же
# сделано в deploy-zapiski.yml и build-android.yml. Переименуете ветку по
# умолчанию — правьте здесь.
on:
  push:
    branches:
      - main
      - claude/cloud-deployment-cross-platform-9nenw7
    paths:
      - 'deploy/**'
      - '.github/workflows/provision-zapiski.yml'
  workflow_dispatch:

permissions:
  contents: read

# Группа общая с job'ом `deploy` из deploy-zapiski.yml: провижн и выкладка
# никогда не идут на сервер одновременно.
concurrency:
  group: zapiski-server
  cancel-in-progress: false

jobs:
  provision:
    name: Установить vhost, выпустить TLS, подготовить каталоги
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Дешёвая страховка: синтаксис vhost проверяется в контейнере ДО того,
      # как файл попадёт на сервер. На сервере ошибка стоила бы отката
      # симлинка, здесь — просто красного шага.
      - name: Проверить синтаксис vhost локально
        run: |
          set -euo pipefail
          docker run --rm \
            -v "${PWD}/deploy/zapiski.cmpas.ru.nginx.conf:/etc/nginx/conf.d/zapiski.conf:ro" \
            nginx:stable-alpine nginx -t

      - name: Загрузить SSH-ключ
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.SERVER_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Отправить конфиг vhost на сервер
        run: |
          set -euo pipefail
          # rsync, а не scp: scp с OpenSSH 9.0 ходит через подсистему SFTP,
          # которой на этом сервере нет, и встаёт молча до потолка шага.
          rsync -az -e "ssh -i ~/.ssh/deploy_key" \
            deploy/zapiski.cmpas.ru.nginx.conf \
            "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/tmp/zapiski.cmpas.ru.nginx.conf"

      - name: Провижн nginx + TLS + каталоги (идемпотентно)
        env:
          # Не секрет: публичный URL этого же репозитория, вычисляется из
          # контекста, чтобы не хардкодить организацию и имя.
          REPO_HTTPS_URL: ${{ github.server_url }}/${{ github.repository }}.git
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key \
            "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" \
            'bash -s' -- "${REPO_HTTPS_URL}" <<'REMOTE'
          set -Eeuo pipefail

          REPO_HTTPS_URL="$1"
          SITE='zapiski.cmpas.ru'
          # Псевдоним: 301 на канонический домен. Сертификат обязан покрывать
          # оба имени, иначе редирект по HTTPS упрётся в ошибку сертификата
          # раньше, чем сработает. Оба домена — наши; сертификат cmpas.ru
          # по-прежнему не переоформляется (ADR-0003 §6).
          ALIAS='notes.cmpas.ru'
          DOCROOT="/var/www/${SITE}"
          CHECKOUT='/var/www/zapiski'
          AVAILABLE="/etc/nginx/sites-available/${SITE}"
          ENABLED="/etc/nginx/sites-enabled/${SITE}"

          log() { printf '[provision] %s\n' "$*"; }

          # ── 1. Свои каталоги (ADR-0003 §1). Ничего чужого не создаём. ──────
          mkdir -p "${DOCROOT}" "${DOCROOT}/updates"
          log "docroot: ${DOCROOT}, каталог обновлений: ${DOCROOT}/updates"

          # ── 2. Ставим vhost в sites-available. ────────────────────────────
          # Файл принадлежит только ЗАПИСКАМ. Конфиг Дневника лежит рядом и
          # этой командой не затрагивается: install пишет строго по пути ниже.
          #
          # Конфиг в репозитории — HTTP-only: `listen 443`, сертификат и
          # редирект дописывает сюда certbot. Значит КАЖДАЯ перезапись снимает
          # ssl-директивы, и сайт остаётся без HTTPS до шага 4. Это не
          # предположение: так и случилось — после провижна вся выкладка упала
          # на «https://zapiski.cmpas.ru не отвечает».
          install -m 644 /tmp/zapiski.cmpas.ru.nginx.conf "${AVAILABLE}"

          # ── 3. Включаем и проверяем. ADR-0003 §5. ─────────────────────────
          ln -sfn "${AVAILABLE}" "${ENABLED}"
          if nginx -t; then
            systemctl reload nginx
            log 'OK: vhost ЗАПИСОК включён, nginx перечитал конфиг. cmpas.ru не затронут.'
          else
            rm -f "${ENABLED}"
            # Возвращаем sites-enabled в заведомо валидное состояние и
            # убеждаемся, что оно действительно валидно.
            nginx -t || log 'ВНИМАНИЕ: nginx -t не проходит и БЕЗ нашего файла — проблема не в ЗАПИСКАХ.'
            log 'ОШИБКА: nginx -t не прошёл. Симлинк ЗАПИСОК снят, reload НЕ выполнялся, cmpas.ru работает как работал.' >&2
            exit 1
          fi

          # ── 4. TLS. ADR-0003 §6: строго -d zapiski.cmpas.ru. ──────────────
          #
          # Решение принимается по ТЕКУЩЕМУ состоянию файла, а не по тому,
          # каким он был до перезаписи. Прежнее условие спрашивало «а лежали ли
          # ssl-директивы здесь ДО install» — и, ответив «нет», уходило в ветку
          # «TLS уже на месте», потому что файл сертификата на диске есть.
          # Наличие сертификата не значит, что его кто-то отдаёт: 443 остался
          # без server-блока, и сайт перестал открываться по HTTPS вовсе.
          #
          # Верное условие проще: сертификат есть, а в конфиге ssl нет —
          # переустановить. Оно самоисцеляющее, потому что описывает не
          # историю, а то, что видно прямо сейчас.
          if [ ! -e "/etc/letsencrypt/live/${SITE}/fullchain.pem" ]; then
            log 'Сертификата нет — выпускаем.'
            # Провал здесь не валит шаг: сайта по HTTPS ещё и не было, а
            # причина обычно внешняя — не доехала A-запись DNS.
            if certbot --nginx -d "${SITE}" -d "${ALIAS}" --non-interactive --agree-tos \
                 -m admin@cmpas.ru --redirect; then
              log "OK: TLS выпущен для ${SITE}."
            else
              log "ПРЕДУПРЕЖДЕНИЕ: certbot не отработал — ${SITE} пока на HTTP. Проверьте A-запись DNS и перезапустите workflow. cmpas.ru не затронут."
            fi
          # Ищется ДИРЕКТИВА, а не строка где угодно в файле. Простой
          # `grep 'ssl_certificate'` находил её в комментарии самого конфига
          # («certbot сам допишет сюда `ssl_certificate*`»), то есть находил
          # ВСЕГДА — и ветка восстановления не срабатывала ни разу за всё время
          # существования этого workflow. Комментарии начинаются с `#`, поэтому
          # шаблон привязан к началу строки.
          elif ! grep -Eq '^[[:space:]]*ssl_certificate[[:space:]]' "${AVAILABLE}"; then
            log 'Сертификат есть, а ssl-директив в конфиге нет — возвращаем их.'
            # А вот здесь провал валит шаг: сайт работал по HTTPS, и после
            # перезаписи конфига перестанет. Молчать об этом нельзя.
            if certbot --nginx -d "${SITE}" -d "${ALIAS}" --non-interactive --agree-tos \
                 -m admin@cmpas.ru --redirect --reinstall; then
              log 'OK: ssl-директивы возвращены в vhost.'
            else
              log "ОШИБКА: certbot --reinstall не отработал — ${SITE} остался без HTTPS." >&2
              exit 1
            fi
          else
            log "TLS для ${SITE} на месте в конфиге, certbot не запускаем."
          fi

          # ── 4a. Убедиться, что HTTPS действительно отвечает. ───────────────
          #
          # Строчка выше — «TLS уже на месте» — говорит лишь о том, что на
          # диске лежит файл сертификата. Отвечает ли по 443 наш server-блок,
          # она не проверяет вовсе, а ровно это провижн только что и переписал:
          # конфиг в репозитории — HTTP-only, ssl-директивы дописывает certbot,
          # и `install` их снимает.
          #
          # Проверяется ровно зона ответственности провижна: что TLS
          # ТЕРМИНИРУЕТСЯ. Любой код ответа — 200, 404, даже 502 — годится:
          # он означает, что рукопожатие прошло и nginx ответил. Не годится
          # только 000, то есть соединения не случилось.
          if [ -e "/etc/letsencrypt/live/${SITE}/fullchain.pem" ]; then
            # Отдельная проверка, чтобы не свалить вину на TLS: без curl ответ
            # был бы «000», и сообщение обвинило бы сертификат вместо
            # отсутствующей утилиты. Тем же curl проверяет себя и выкладка.
            command -v curl >/dev/null 2>&1 \
              || { log 'ОШИБКА: на сервере нет curl — проверить HTTPS нечем.' >&2; exit 1; }
            # Без `|| echo 000`: curl печатает «000» сам, а второй источник
            # того же значения давал «000000» — строку, не равную ни одному
            # ожидаемому коду, и проверка проходила ровно в том случае, ради
            # которого написана. Поймано прогоном на закрытом порту.
            https_code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 \
              "https://${SITE}/" 2>/dev/null || true)"
            if [ -z "${https_code}" ] || [ "${https_code}" = '000' ]; then
              log "ОШИБКА: сертификат есть, но https://${SITE}/ не отвечает — TLS не терминируется." >&2
              log 'Скорее всего, перезапись vhost сняла ssl-директивы. Лечение: certbot --nginx -d ЗАПИСКИ --reinstall --redirect.' >&2
              exit 1
            fi
            log "HTTPS отвечает (код ${https_code}) — TLS терминируется."
          else
            log 'Сертификата нет — HTTPS проверять нечего, сайт на HTTP.'
          fi

          # ── 5. Каталог для кода API. ──────────────────────────────────────
          # Именно отсюда deploy-zapiski.yml запускает
          # deploy/deploy-production-remote.sh. Каталог свой, /var/www/cmpas.ru
          # не трогается (ADR-0003 §3).
          #
          # Репозиторий здесь НЕ клонируется. Раньше клонировался — и упирался
          # в то, что репозиторий приватный: серверу пришлось бы выдать deploy
          # key, то есть завести на нём постоянный доступ к GitHub. Вместо
          # этого код доставляет rsync'ом сам деплой: он и так работает с уже
          # выкачанного раннера, а на сервере не остаётся ни одного лишнего
          # ключа. Тот же приём применяется на этом сервере для
          # moments.cmpas.ru.
          mkdir -p "${CHECKOUT}"
          log "Каталог для кода API готов: ${CHECKOUT}"

          log 'Провижн завершён.'
          REMOTE

      - name: Убрать SSH-ключ
        if: always()
        run: rm -f ~/.ssh/deploy_key
