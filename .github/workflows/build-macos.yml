name: Сборка macOS

# ЗАПИСКИ под macOS: .app и .dmg.
#
# ── Что это и чем отличается от Windows ─────────────────────────────────────
#
# Сборка РУЧНАЯ. На сервер и в фид обновлений ничего не уезжает: пока это
# отдельная ветка и отдельная задача, а не канал доставки. Артефакт живёт две
# недели в прогоне — этого хватает, чтобы скачать, поставить и проверить.
#
# ── Подписи не будет, и это сказано вслух ───────────────────────────────────
#
# Apple Developer Program (99 $/год) у нас нет, значит нет ни сертификата
# Developer ID, ни нотаризации. Gatekeeper на такое приложение скажет «не
# удалось проверить разработчика» — это ожидаемо, и объясняется человеку на
# странице /macos-warning, а не замалчивается.
#
# Ad-hoc подпись (`codesign -s -`) сертификата не заменяет и Gatekeeper не
# успокаивает. Она нужна для другого: на Apple Silicon бинарь БЕЗ ЛЮБОЙ
# подписи не запускается вовсе — ядро отказывает в исполнении. То есть без
# ad-hoc сборка была бы не «с предупреждением», а мёртвой.

# Триггер по путям, а не по каждому пушу. Минута раннера macOS стоит десять
# обычных, и гонять сборку на правку сервера — трата без ответа на вопрос.
# Зато когда меняется общий код, сборка обязана пройти: обещание «один код на
# все платформы» проверяется только тем, что все платформы собираются.
on:
  push:
    branches:
      - claude/cloud-deployment-cross-platform-9nenw7
    paths:
      - 'apps/desktop/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/build-macos.yml'
  pull_request:
    paths:
      - 'apps/desktop/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/build-macos.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Приложение macOS
    # macos-14 — Apple Silicon. Собирать universal удобнее именно на нём:
    # Rosetta для второй половины не нужна, оба таргета ставятся штатно.
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Версия НЕ задаётся: она объявлена в package.json (`packageManager`),
      # и второе объявление здесь action отвергает как расхождение. Ровно так
      # же сделано в сборке Windows.
      - name: Установить pnpm
        uses: pnpm/action-setup@v4

      - name: Установить Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Обе архитектуры: universal-apple-darwin — это не отдельный таргет
      # компилятора, а склейка двух готовых бинарей через `lipo`. Не хватит
      # одной — сборка упадёт на самом последнем шаге, после всей компиляции.
      - name: Установить Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Кэш cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
          shared-key: zapiski-desktop-macos
          cache-on-failure: true

      - name: Версии инструментов
        run: |
          set -euo pipefail
          node --version
          pnpm --version
          rustc --version
          rustup target list --installed
          sw_vers

      - name: Установка зависимостей
        run: |
          set -euo pipefail
          if pnpm install --frozen-lockfile; then
            echo 'Лок-файл актуален.'
          else
            echo "::warning title=Лок-файл устарел::pnpm-lock.yaml разошёлся с package.json. Выполните «pnpm install» и закоммитьте pnpm-lock.yaml."
            pnpm install --no-frozen-lockfile
          fi

      - name: Сборка пакетов
        run: pnpm -r --filter "./packages/**" run build

      - name: Проверка типов оболочки
        run: pnpm --filter @zapiski/desktop typecheck

      - name: Сборка фронтенда
        run: pnpm --filter @zapiski/desktop run build:vite

      # Иконка macOS живёт в репозитории и собирается тем же скриптом, что и
      # остальные. Проверяем, что она на месте: без .icns бандлер молча кладёт
      # в .app иконку по умолчанию, и приложение выглядит чужим.
      - name: Иконка .icns на месте
        run: |
          set -euo pipefail
          file apps/desktop/src-tauri/icons/icon.icns
          head -c 4 apps/desktop/src-tauri/icons/icon.icns | grep -q 'icns'
          echo 'icns на месте.'

      - name: Определить режим подписи обновлений
        id: signing
        env:
          SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SIGNING_KEY:-}" ]; then
            echo '::warning::Секрет TAURI_SIGNING_PRIVATE_KEY не задан — собираем БЕЗ подписи манифеста обновлений. Это НАША подпись фида, к Apple отношения не имеет. Артефакты .app.tar.gz и .sig не создаются.'
            echo 'signed=false' >> "${GITHUB_OUTPUT}"
          else
            echo 'Ключ подписи обновлений на месте.'
            echo 'signed=true' >> "${GITHUB_OUTPUT}"
          fi

      # `createUpdaterArtifacts: true` без приватного ключа роняет бандлер.
      # Файл пишется на раннере и в репозиторий не попадает.
      - name: Отключить артефакты апдейтера (сборка без подписи)
        if: steps.signing.outputs.signed != 'true'
        working-directory: apps/desktop
        run: |
          set -euo pipefail
          cat > tauri.ci-unsigned.conf.json <<'JSON'
          {
            "bundle": {
              "createUpdaterArtifacts": false
            }
          }
          JSON
          cat tauri.ci-unsigned.conf.json

      # ── Сборка ────────────────────────────────────────────────────────────
      #
      # Сначала universal. Не вышло — не молчим и не выдаём aarch64 за
      # universal: печатаем предупреждение и говорим, что именно собрано.
      # Молча суженная сборка — это Intel-Мак, на котором приложение просто
      # не запустится, и никто не будет знать почему.
      #
      # APPLE_SIGNING_IDENTITY="-" — та самая ad-hoc подпись. Tauri передаёт
      # значение в `codesign -s`, и прочерк означает «подписать без
      # сертификата». Делать это ПОСЛЕ сборки .dmg поздно: подписывать надо
      # .app, который внутрь образа уже уложен.
      - name: Сборка .app и .dmg
        id: build
        working-directory: apps/desktop
        env:
          SIGNED: ${{ steps.signing.outputs.signed }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: '-'
        run: |
          set -euo pipefail
          common=()
          if [ "${SIGNED}" != 'true' ]; then
            common+=(--config tauri.ci-unsigned.conf.json)
          fi

          if pnpm exec tauri build --target universal-apple-darwin "${common[@]}"; then
            echo 'target=universal-apple-darwin' >> "${GITHUB_OUTPUT}"
            echo 'Собрано universal: работает и на Apple Silicon, и на Intel.'
          else
            echo '::warning title=universal не собрался::Собираем только aarch64 (Apple Silicon). На компьютерах с процессором Intel эта сборка НЕ запустится. Причина — в логе шага выше.'
            pnpm exec tauri build --target aarch64-apple-darwin "${common[@]}"
            echo 'target=aarch64-apple-darwin' >> "${GITHUB_OUTPUT}"
          fi

      # Подпись проверяется, а не подразумевается: без неё .app на Apple
      # Silicon не запускается, и узнать об этом на чужом компьютере — самый
      # дорогой способ.
      - name: Проверить ad-hoc подпись
        env:
          TARGET: ${{ steps.build.outputs.target }}
        run: |
          set -euo pipefail
          app="$(find "apps/desktop/src-tauri/target/${TARGET}/release/bundle/macos" -maxdepth 1 -name '*.app' | head -1)"
          if [ -z "${app}" ]; then
            echo '::error::.app не найден — собирать .dmg было не из чего'
            exit 1
          fi
          echo "Приложение: ${app}"
          codesign -dv --verbose=2 "${app}" 2>&1 | sed -n '1,12p'
          codesign --verify --deep --strict "${app}"
          echo 'Подпись на месте (ad-hoc). Нотаризации нет и не будет: у нас нет Apple Developer Program.'

      # `universal-apple-darwin` — это `lipo`, склеивающий два отдельно
      # собранных бинаря. Склейка не гарантирована самим фактом успешного
      # шага сборки: если один таргет неявно не собрался (кэш, флаг, версия
      # тулчейна), `lipo` может отработать и на одном бинаре, а
      # target=universal-apple-darwin в выводе уже написан. Тихо суженная
      # сборка — ровно тот сценарий, который сама сборка называет по имени
      # («Intel-Мак, на котором приложение не запустится, и никто не будет
      # знать почему») — только для него не было проверки, только warning на
      # случай отказа ВСЕГО universal-таргета целиком.
      - name: Архитектуры внутри бинаря
        env:
          TARGET: ${{ steps.build.outputs.target }}
        run: |
          set -euo pipefail
          app="$(find "apps/desktop/src-tauri/target/${TARGET}/release/bundle/macos" -maxdepth 1 -name '*.app' | head -1)"
          binary="${app}/Contents/MacOS/zapiski-desktop"
          archs="$(lipo -archs "${binary}")"
          echo "Архитектуры в бинаре: ${archs}"
          if [ "${TARGET}" = 'universal-apple-darwin' ]; then
            for want in arm64 x86_64; do
              case " ${archs} " in
                *" ${want} "*) ;;
                *)
                  echo "::error title=Universal-сборка сузилась::заявлен target=universal-apple-darwin, а в бинаре нет ${want}. Собрано только: ${archs}. На Мак с этой архитектурой приложение не запустится."
                  exit 1
                  ;;
              esac
            done
            echo 'Обе архитектуры на месте: arm64 и x86_64.'
          else
            echo "::warning::universal не собрался на этом прогоне (см. предупреждение шага «Сборка .app и .dmg») — в бинаре только ${archs}."
          fi

      - name: Найти .dmg и посчитать отпечаток
        id: dmg
        env:
          TARGET: ${{ steps.build.outputs.target }}
        run: |
          set -euo pipefail
          file="$(find "apps/desktop/src-tauri/target/${TARGET}/release/bundle/dmg" -maxdepth 1 -name '*.dmg' | head -1)"
          if [ -z "${file}" ]; then
            echo '::error::.dmg не собрался — ставить пользователю нечего'
            exit 1
          fi
          size="$(du -h "${file}" | cut -f1)"
          sha="$(shasum -a 256 "${file}" | cut -d' ' -f1)"
          echo "path=${file}" >> "${GITHUB_OUTPUT}"
          echo "Файл: ${file} (${size})"
          echo "SHA-256: ${sha}"
          {
            echo '### Сборка macOS'
            echo
            echo "* архитектура: \`${TARGET}\`"
            echo "* файл: \`$(basename "${file}")\`, ${size}"
            echo "* SHA-256: \`${sha}\`"
            echo
            echo 'Подпись ad-hoc, нотаризации нет. Первый запуск — правым щелчком по приложению → «Открыть».'
          } >> "${GITHUB_STEP_SUMMARY}"

      # Отдельный артефакт и НИКАКОЙ выкладки на сервер: пока это ручная
      # сборка, и в фид обновлений она не попадает.
      - name: Сохранить .dmg
        uses: actions/upload-artifact@v4
        with:
          name: zapiski-macos-dmg
          path: ${{ steps.dmg.outputs.path }}
          if-no-files-found: error
          retention-days: 14

      # ── Запуск: доказать, что приложение действительно открывается ─────────
      #
      # До этого шага .app только СОБРАН и подписан ad-hoc — и ни разу не
      # исполнялся. CI-машина не «чужой компьютер»: файл собран здесь же, у
      # него нет атрибута карантина `com.apple.quarantine`, и Gatekeeper тут
      # ни при чём — запуск либо переживёт первую секунду, либо упадёт по
      # причине в самом коде. Раньше об этом узнавали только с чужого Мака.
      #
      # Шаг стоит ПОСЛЕ выгрузки артефакта: упадёт — .dmg всё равно можно
      # будет скачать и открыть руками (тот же приём, что и у проверки
      # CFBundleDocumentTypes ниже).
      - name: Запустить .app и проверить, что процесс не падает
        env:
          TARGET: ${{ steps.build.outputs.target }}
        run: |
          set -euo pipefail
          app="$(find "apps/desktop/src-tauri/target/${TARGET}/release/bundle/macos" -maxdepth 1 -name '*.app' | head -1)"
          binary="${app}/Contents/MacOS/zapiski-desktop"
          if [ ! -x "${binary}" ]; then
            echo "::error::бинарь не найден или не исполняемый: ${binary}"
            exit 1
          fi

          marker="$(mktemp)"
          log="$(mktemp)"
          # Запуск как у человека — без --tray: тот путь, где показывается окно.
          "${binary}" > "${log}" 2>&1 &
          pid=$!

          # 10 с — щедрый запас: окно показывается по сигналу фронтенда, а
          # собственная подстраховка приложения (REVEAL_FALLBACK) на случай
          # молчания фронтенда срабатывает через 2,5 с.
          alive='нет'
          for _ in $(seq 1 20); do
            sleep 0.5
            if ! kill -0 "${pid}" 2>/dev/null; then
              break
            fi
            alive='да'
          done

          if [ "${alive}" != 'да' ]; then
            echo '::error title=Приложение не пережило запуск::процесс завершился сам меньше чем за секунду — вывод ниже'
            cat "${log}" || true
            exit 1
          fi
          echo 'Процесс жив спустя 10 с после запуска — приложение не падает на старте.'

          kill "${pid}" 2>/dev/null || true
          wait "${pid}" 2>/dev/null || true
          pkill -f "${binary}" 2>/dev/null || true

          # Падение уже ПОСЛЕ первых секунд (например, при первом сигнале от
          # фронтенда) процесс живым не покажет — его ловит отчёт системы.
          crash="$(find ~/Library/Logs/DiagnosticReports -maxdepth 1 \( -name 'zapiski-desktop-*' -o -name 'zapiski-desktop_*' \) -newer "${marker}" 2>/dev/null | head -1)"
          if [ -n "${crash}" ]; then
            echo "::error title=Найден отчёт о падении::${crash}"
            cat "${crash}" || true
            exit 1
          fi

          echo 'Отчётов о падении в DiagnosticReports нет.'
          echo '### Запуск .app' >> "${GITHUB_STEP_SUMMARY}"
          echo 'Приложение запустилось на CI-машине и проработало 10 с без падения.' >> "${GITHUB_STEP_SUMMARY}"

      # ── Ассоциация с .md: проверка без Мака ───────────────────────────────
      #
      # `fileAssociations` в конфиге — это ОБЕЩАНИЕ. Выполняет его бандлер,
      # раскладывая `CFBundleDocumentTypes` по Info.plist, и до сих пор мы
      # верили ему на слово: пункт числился сделанным, а проверить его без
      # компьютера с macOS было нечем.
      #
      # Проверить есть чем. Образ монтируется здесь же, и Info.plist читается
      # из ТОГО .app, который поедет человеку, — не из каталога сборки. Разница
      # существенная: подписывали и упаковывали мы разные копии, и «в сборке
      # было» не означает «в образе есть».
      #
      # Шаг стоит ПОСЛЕ выгрузки артефакта намеренно. Если секции не окажется,
      # сборка станет красной — но .dmg уже будет лежать и его можно будет
      # скачать и посмотреть глазами.
      - name: Проверить CFBundleDocumentTypes в готовом .app
        env:
          DMG: ${{ steps.dmg.outputs.path }}
        run: |
          set -euo pipefail
          mount="$(mktemp -d)"
          hdiutil attach "${DMG}" -nobrowse -readonly -mountpoint "${mount}" > /dev/null
          trap 'hdiutil detach "${mount}" -quiet || true' EXIT

          app="$(find "${mount}" -maxdepth 1 -name '*.app' | head -1)"
          if [ -z "${app}" ]; then
            echo '::error::в образе нет .app — ставить пользователю нечего'
            exit 1
          fi
          plist="${app}/Contents/Info.plist"
          echo "Info.plist из образа: ${plist}"

          section="$(plutil -extract CFBundleDocumentTypes xml1 -o - "${plist}" 2>/dev/null || true)"
          if [ -z "${section}" ]; then
            {
              echo
              echo '#### Ассоциация с .md'
              echo
              echo 'В Info.plist готового .app **нет секции CFBundleDocumentTypes**.'
              echo 'Двойной щелчок по файлу .md приложение не откроет: система о нём не знает.'
            } >> "${GITHUB_STEP_SUMMARY}"
            echo '::error title=CFBundleDocumentTypes отсутствует::fileAssociations в конфиге есть, а в собранном Info.plist секции нет — ассоциация с .md не работает.'
            exit 1
          fi

          echo '── CFBundleDocumentTypes ─────────────────────────────────────'
          printf '%s\n' "${section}"
          echo '──────────────────────────────────────────────────────────────'

          # Секция может быть и пустой болванкой. Смотрим на то, ради чего она
          # заводилась: расширение md и роль редактора, а не просмотрщика.
          missing=''
          printf '%s' "${section}" | grep -q '<string>md</string>' || missing="${missing} расширение md;"
          printf '%s' "${section}" | grep -q '<string>Editor</string>' || missing="${missing} роль Editor;"
          if [ -n "${missing}" ]; then
            echo "::error title=Ассоциация неполна::в CFBundleDocumentTypes не хватает:${missing}"
            exit 1
          fi

          {
            echo
            echo '#### Ассоциация с .md'
            echo
            echo 'В Info.plist готового `.app` есть `CFBundleDocumentTypes` с расширением `md` и ролью `Editor`.'
            echo 'Читалось из образа `.dmg`, а не из каталога сборки. Полная секция — в логе шага.'
            echo
            echo '```xml'
            printf '%s\n' "${section}"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

      # ── Настоящий вердикт Gatekeeper, а не наше предположение о нём ────────
      #
      # Всё, что было выше, проверяло СБОРКУ: подпись есть, процесс не падает,
      # ассоциация с .md на месте. Ни один из этих шагов не воспроизводит то,
      # с чем сталкивается человек, — двойной щелчок по приложению, СКАЧАННОМУ
      # из интернета. У собранного здесь же .app нет атрибута
      # `com.apple.quarantine`, и предыдущий смоук-тест запускал бинарь
      # напрямую из шелла — тем же путём, каким Gatekeeper вообще не
      # интересуется. Заказчик прислал реальный отказ («Не удается открыть
      # программу «ЗАПИСКИ».», одна кнопка OK) — то есть страница
      # /macos-warning и предыдущий смоук-тест не покрывают ровно тот путь, на
      # котором ломается по-настоящему.
      #
      # Здесь имитируется этот путь без живого человека и без GUI-диалога:
      # .app копируется из готового .dmg (не из каталога сборки — та же
      # причина, что и у CFBundleDocumentTypes выше), помечается тем же
      # атрибутом карантина, что ставит браузер при скачивании, и оценивается
      # командой, которую использует сама Finder при попытке открыть файл —
      # `spctl -t open --context context:primary-signature`. Это не догадка
      # по форумам, а прямой ответ Gatekeeper на настоящей macOS-14 машине.
      #
      # Отказ (rejected) здесь — это НЕ поломка сборки: ad-hoc подпись без
      # нотаризации отклоняется всегда, ради этого и существует
      # /macos-warning. Шаг падает не на отказе, а если сама проверка
      # отказывается работать (сломанный .app, spctl не нашёл вообще ничего) —
      # такое уже не в духе «нужен пароль», а в духе «сборка битая».
      - name: Настоящий вердикт Gatekeeper на закарантиненной копии
        env:
          DMG: ${{ steps.dmg.outputs.path }}
        run: |
          set -euo pipefail
          mount="$(mktemp -d)"
          hdiutil attach "${DMG}" -nobrowse -readonly -mountpoint "${mount}" > /dev/null
          trap 'hdiutil detach "${mount}" -quiet || true' EXIT

          src="$(find "${mount}" -maxdepth 1 -name '*.app' | head -1)"
          if [ -z "${src}" ]; then
            echo '::error::в образе нет .app — проверять нечего'
            exit 1
          fi

          # Копия в writable-каталог — как перетаскивание из окна .dmg в
          # «Программы». Смонтированный образ read-only, xattr на него не
          # поставить, да и реальный путь пользователя именно такой.
          work="$(mktemp -d)"
          app="${work}/$(basename "${src}")"
          cp -R "${src}" "${app}"

          # Атрибут карантина: ставит его браузер при скачивании файла, не
          # система при установке. Формат «флаги;время;агент;UUID» —
          # `0083` (LSQuarantineTypeOtherDownload) — тот же класс, что у
          # .dmg, скачанного из Chrome или Safari.
          xattr -w com.apple.quarantine "0083;$(printf '%08x' "$(date +%s)");Safari;$(uuidgen)" "${app}"
          xattr -p com.apple.quarantine "${app}"

          echo '── spctl -t open (оценка «пользователь открывает из Finder») ──'
          set +e
          verdict="$(spctl -a -vv -t open --context context:primary-signature "${app}" 2>&1)"
          code=$?
          set -e
          printf '%s\n' "${verdict}"
          echo "── код возврата spctl: ${code} ──────────────────────────────"

          {
            echo
            echo '#### Вердикт Gatekeeper (spctl -t open, с атрибутом карантина)'
            echo
            echo 'Проверено на закарантиненной копии `.app` из готового `.dmg` — то, что'
            echo 'реально видит Gatekeeper при открытии скачанного файла, а не догадка.'
            echo
            echo '```'
            printf '%s\n' "${verdict}"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

          if [ "${code}" -eq 0 ]; then
            echo 'Принято без предупреждения — неожиданно для ad-hoc без нотаризации, но не проблема.'
            exit 0
          fi

          if printf '%s' "${verdict}" | grep -qi 'no such file\|not accessible\|source=$'; then
            echo '::error title=spctl не смог оценить .app::см. вывод выше — это не «нужно разрешение в настройках», а сломанная проверка или сломанный .app.'
            exit 1
          fi

          echo 'Gatekeeper отклоняет (rejected) — ожидаемо для ad-hoc подписи без нотаризации.'
          echo 'Причина отказа — в «source=» строке вывода выше; это и есть тот текст,'
          echo 'который в итоге определяет, какой путь обхода доступен человеку.'

  # ── Подпись на настоящей Tahoe: факт вместо догадки ──────────────────────────
  #
  # Заказчик сообщил о двух РАЗНЫХ отказах на разных Мак: на M2 (старее macOS)
  # помогает «Всё равно открыть» в Настройках, на M4 — голое «Не удается
  # открыть программу», без единого пункта обхода нигде. Раннер macos-14 этого
  # не видит: это Sonoma, не Tahoe. С февраля 2026 у GitHub есть настоящие
  # Tahoe-раннеры (macos-26) — с тех пор это можно проверить фактом, а не
  # гадать по форумам.
  #
  # Внешний источник объяснял разницу так: на Tahoe инструментарий подписи по
  # умолчанию режет CodeDirectory страницами по 16 КБ вместо 4 КБ, и ядро
  # (AMFI) будто бы отвергает такую подпись у крупных бинарей уже ПОСЛЕ старта
  # процесса. ПРОВЕРЕНО НА НАСТОЯЩЕЙ macOS 26.5.2 (25F84) и ОПРОВЕРГНУТО:
  #
  #   · Page size у нашего бинаря УЖЕ 4096, не 16384 — чинить нечем, версия
  #     неприменима к этой сборке в принципе (правка --pagesize=4096 была бы
  #     no-op).
  #   · codesign --verify --deep --strict: «valid on disk, satisfies its
  #     Designated Requirement» — подпись структурно исправна.
  #   · xattr com.apple.provenance на файле нет вовсе — альтернативная версия
  #     (из issue astral-sh/uv и openai/codex) тоже не подтвердилась.
  #   · log show по kernel/syspolicyd/amfid за время попытки запуска —
  #     НИ ОДНОЙ строки про сигнатуру, политику или отказ.
  #   · Настоящий `open -n` на закарантиненной копии не убил процесс: он
  #     провисел живым до принудительной уборки раннера 20 минут спустя —
  #     то есть ядро его не отвергло и не убило, а `open` синхронно ждал
  #     разрешения диалога Gatekeeper, которое в headless CI некому дать.
  #
  # Итог: `spctl -t open` на Tahoe отвечает тем же самым «rejected» без
  # source=, что и на macos-14, — это тот же самый, уже объяснённый на
  # /macos-warning случай (ad-hoc подпись без нотаризации, версия macOS может
  # не показывать обход в Настройках вовсе), а не отдельный баг AMFI. Реальная
  # попытка запуска убрана из постоянного job: она не блокируется и не падает
  # сама — она виснет до таймаута раннера и ничего нового не измеряет сверх
  # уже полученного факта. Осталась только быстрая (~15 с) проверка подписи —
  # держит вахту на случай, если будущее обновление Tauri/Xcode сменит page
  # size по умолчанию, и тогда снова будет что чинить.
  verify-tahoe:
    name: Подпись на настоящей Tahoe (macOS 26)
    needs: build
    runs-on: macos-26
    timeout-minutes: 10

    steps:
      - name: Версия системы и инструментов
        run: |
          set -euo pipefail
          sw_vers
          codesign --version 2>&1 || true
          xcodebuild -version 2>&1 || true

      - name: Скачать собранный .dmg
        uses: actions/download-artifact@v4
        with:
          name: zapiski-macos-dmg
          path: dmg

      - name: Подготовить закарантиненную копию, как у реального пользователя
        id: prep
        run: |
          set -euo pipefail
          dmg="$(find dmg -maxdepth 1 -name '*.dmg' | head -1)"
          if [ -z "${dmg}" ]; then
            echo '::error::.dmg-артефакт не скачался — проверять нечего'
            exit 1
          fi

          mount="$(mktemp -d)"
          hdiutil attach "${dmg}" -nobrowse -readonly -mountpoint "${mount}" > /dev/null
          src="$(find "${mount}" -maxdepth 1 -name '*.app' | head -1)"
          if [ -z "${src}" ]; then
            hdiutil detach "${mount}" -quiet || true
            echo '::error::в образе нет .app'
            exit 1
          fi

          work="$(mktemp -d)"
          app="${work}/$(basename "${src}")"
          cp -R "${src}" "${app}"
          hdiutil detach "${mount}" -quiet

          xattr -w com.apple.quarantine "0083;$(printf '%08x' "$(date +%s)");Safari;$(uuidgen)" "${app}"
          echo "app=${app}" >> "${GITHUB_OUTPUT}"
          echo "bin=${app}/Contents/MacOS/zapiski-desktop" >> "${GITHUB_OUTPUT}"

      # Регрессионный сторож: если будущее обновление Tauri/Xcode снова
      # начнёт резать CodeDirectory страницами по 16 КБ или добавит xattr
      # com.apple.provenance — здесь это будет видно фактом, а не жалобой
      # пользователя месяцы спустя. Сейчас (Tauri 2.11.x, Xcode 26.6) оба
      # значения в порядке — см. комментарий у job выше.
      - name: Подпись на Tahoe — page size, provenance, spctl
        run: |
          set -euo pipefail
          app="${{ steps.prep.outputs.app }}"
          bin="${{ steps.prep.outputs.bin }}"

          echo '── codesign -dvvv (main executable) ──────────────────────────'
          codesign -dvvv --verbose=4 "${bin}" 2>&1 || true
          echo '── codesign --verify --deep --strict ──────────────────────────'
          codesign --verify --deep --strict --verbose=4 "${app}" 2>&1 || true

          echo '── xattr на .app ────────────────────────────────────────────'
          xattr -l "${app}" 2>&1 || true

          echo '── spctl -t open (то же, что видит Finder) ────────────────────'
          verdict="$(spctl -a -vv -t open --context context:primary-signature "${app}" 2>&1 || true)"
          printf '%s\n' "${verdict}"

          page_size="$(codesign -dvvv --verbose=4 "${bin}" 2>&1 | grep -o 'Page size=[0-9]*' | cut -d= -f2 || true)"
          has_provenance='нет'
          xattr -p com.apple.provenance "${bin}" > /dev/null 2>&1 && has_provenance='да'

          {
            echo '### Подпись на настоящей macOS 26 (Tahoe)'
            echo
            echo "* Page size CodeDirectory: \`${page_size:-?}\`"
            echo "* xattr com.apple.provenance: ${has_provenance}"
            echo "* Вердикт spctl -t open: \`$(printf '%s' "${verdict}" | tail -1)\`"
            echo
            echo 'Тот же bare `rejected` без `source=`, что и на macos-14 —'
            echo 'ожидаемое поведение ad-hoc подписи без нотаризации на этой версии'
            echo 'macOS, объяснено на /macos-warning. Реальный запуск через `open`'
            echo 'здесь не проверяется намеренно: в headless CI он виснет до'
            echo 'таймаута раннера вместо ответа (LaunchServices ждёт закрытия'
            echo 'диалога Gatekeeper, которое некому дать) и не измеряет ничего'
            echo 'сверх того, что уже видно по подписи и spctl выше.'
          } >> "${GITHUB_STEP_SUMMARY}"

          if [ "${page_size}" != '4096' ]; then
            echo "::error title=Page size CodeDirectory изменился::было 4096, стало ${page_size:-пусто}. Раньше на этом настаивал внешний тикет про AMFI на Tahoe — если это подтвердится ещё и реальным отказом запуска у пользователя, здесь есть с чего начинать."
            exit 1
          fi
          if [ "${has_provenance}" = 'да' ]; then
            echo '::warning title=Появился xattr com.apple.provenance::раньше отсутствовал. Это тот атрибут, на который ссылались issue astral-sh/uv и openai/codex как на причину похожего отказа — стоит присмотреться, если появятся новые жалобы на Tahoe.'
          fi
