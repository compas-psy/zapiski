name: Сборка Android

# Сборка ЗАПИСОК под Android (Tauri 2 Mobile).
#
# Android SDK и NDK есть только здесь: на машине разработчика `tauri android
# build` не выполняется в принципе, поэтому этот workflow — единственное место,
# где APK вообще появляется. Всё, что можно проверить без устройства
# (валидность tauri.conf.json, патч манифеста, компиляция Rust под хост, типы
# фронтенда), проверяется до сборки — чтобы падение случилось на понятном шаге.
#
# ПОДПИСЬ — САМОЕ ВАЖНОЕ МЕСТО ФАЙЛА.
#   Android ставит обновление поверх установленного приложения, только если
#   подпись совпадает. Сменили keystore или алиас — пользователь обязан
#   удалить приложение и поставить заново, потеряв локальные настройки; в
#   Google Play смена ключа невозможна вовсе.
#
# ДВА КАНАЛА, И ОНИ НЕ СМЕШИВАЮТСЯ.
#
#   production — тег `v*`, пуш в ветку по умолчанию и ручной запуск с явно
#   выбранным каналом. Здесь правило жёсткое: APK либо собран как release,
#   подписан постоянным ключом из ANDROID_* и прошёл проверку готового файла,
#   либо его нет вовсе. Нет хотя бы одного из четырёх секретов — падаем ДО
#   получаса компиляции. Неполный комплект — падаем всегда, на любом канале:
#   половина настройки это ошибка, а не повод собрать что-нибудь.
#
#   development — всё остальное: pull request, чужая ветка, ручной запуск без
#   выбора. Здесь допустим DEBUG-APK, и он честно называется `-debug`. Он
#   живёт ровно в одном месте — во вкладке Actions, семь дней. Он НИКОГДА не
#   попадает ни в /updates/latest/zapiski.apk, ни в latest.json, ни в GitHub
#   Release, ни в кнопку «Скачать» на промостранице.
#
# ПОЧЕМУ ЭТО ПЕРЕПИСАНО.
#   Заказчик: «сертификат подписи в андроид блокируется проверкой при
#   установке и не проходит проверку Play Защиты». Дело было не в ключе.
#   Сборка работала fail-open: нет секретов — молча берём ОТЛАДОЧНЫЙ ключ,
#   собираем `--debug`, и дальше те же строки кладут результат в
#   /updates/latest/zapiski.apk. То есть публичная кнопка могла отдавать
#   пакет с `CN=Android Debug` — первое, на что реагирует Play Защита.
#
#   Теперь единственная дорога наружу такая:
#     ANDROID_* → проверка keystore и алиаса → EXPECTED_SIGNER_SHA256 →
#     release-сборка → zipalign → apksigner sign (v1+v2+v3) →
#     apksigner verify → отказ при CN=Android Debug → отпечаток APK совпал с
#     ключом → verified_release=true → сервер, Release, фид обновлений.
#   Всё остальное — разработка, и пользовательским APK не становится никогда.
#
#   Ключ подписи в репозитории не хранится (.gitignore, *.jks; стережёт
#   security.yml), а в лог печатается только ПУБЛИЧНЫЙ отпечаток сертификата —
#   по нему сверяют, что выпуск подписан тем же ключом, что и прошлый.

on:
  # Фильтра `paths` здесь нет намеренно: GitHub применил бы его и к тегам, и
  # тег `v*` на коммите без изменений в apps/mobile тихо не запустил бы релиз.
  # Отбор по изменённым файлам делает job `changes` ниже — он умеет различать
  # тег и пуш в ветку, а `on:` не умеет.
  push:
    # Ветка по умолчанию у репозитория — не `main`: репозиторий создавался
    # пустым, и веткой по умолчанию стала первая запушенная. В `on:` выражения
    # (`github.event.repository.default_branch`) не работают, поэтому имя ветки
    # перечислено буквально. Если ветку по умолчанию переименуют — правьте
    # здесь, иначе сборка молча перестанет запускаться.
    branches:
      - main
      - claude/cloud-deployment-cross-platform-9nenw7
    tags: ["zapiski-v*"]
  pull_request:
    branches:
      - main
      - claude/cloud-deployment-cross-platform-9nenw7
    paths:
      - 'apps/mobile/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:
    inputs:
      # Производственный канал руками — только явным выбором.
      #
      # Умолчание безопасное: ручной запуск считается разработческим, пока не
      # попросили обратного. Обратный порядок означал бы, что случайный запуск
      # не с той ветки способен переписать файл, который люди качают по кнопке.
      channel:
        description: 'Канал сборки: development (по умолчанию) или production'
        required: false
        default: development
        type: choice
        options:
          - development
          - production

permissions:
  contents: read

env:
  # Версия NDK, на которой сборка описана и проверена. Если в образе раннера
  # её нет — берётся то, что есть, с предупреждением в логе (шаг «NDK»).
  ZAPISKI_NDK_VERSION: '27.1.12297006'

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # ЧТО ИЗМЕНИЛОСЬ
  # ───────────────────────────────────────────────────────────────────────────
  #
  # Пуш в ветку запускал сборку всегда, потому что фильтра `paths` у `push`
  # нет — и не может быть: GitHub применяет его и к тегам, а тег `v*`,
  # поставленный на коммит без изменений в оболочке, тихо не запустил бы релиз.
  #
  # Заказчик спросил прямо: «зачем сборка Windows и Android, когда выкладывается
  # промостраница?». Незачем — и полтора часа раннеров уходили впустую на каждую
  # правку лендинга. Фильтр переехал из `on:` в отдельный job: теги и ручной
  # запуск собираются всегда, а пуш в ветку — только если тронуто то, из чего
  # собирается приложение.
  changes:
    name: Что изменилось
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      build: ${{ steps.check.outputs.build }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: check
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" = "tag" ] || [ "${GITHUB_EVENT_NAME}" != "push" ]; then
            echo 'Тег или ручной запуск — собираем без разговоров.'
            echo 'build=true' >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          base="${BEFORE:-}"
          # Новая ветка приходит с нулями вместо предыдущего коммита: сравнить
          # не с чем, поэтому берём родителя. Если и его нет — собираем.
          if [ -z "${base}" ] || [ "${base}" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            base="$(git rev-parse "${GITHUB_SHA}^" 2>/dev/null || true)"
          fi
          if [ -z "${base}" ]; then
            echo '::warning::не с чем сравнить — собираем на всякий случай'
            echo 'build=true' >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          files="$(git diff --name-only "${base}" "${GITHUB_SHA}")"
          echo "Изменено файлов: $(printf '%s' "${files}" | grep -c . || true)"
          if printf '%s\n' "${files}" | grep -Eq '^(apps/mobile/|packages/|pnpm-lock\.yaml|pnpm-workspace\.yaml|package\.json|\.github/workflows/build-android\.yml)'; then
            echo 'Тронуто то, из чего собирается приложение.'
            echo 'build=true' >> "${GITHUB_OUTPUT}"
          else
            echo 'Приложение не тронуто — сборка не нужна.'
            echo 'build=false' >> "${GITHUB_OUTPUT}"
          fi

  # ───────────────────────────────────────────────────────────────────────────
  # BUILD
  # ───────────────────────────────────────────────────────────────────────────
  build:
    needs: changes
    if: needs.changes.outputs.build == 'true'
    name: APK
    runs-on: ubuntu-latest
    # 60 минут не хватает на холодный кэш: два Rust-таргета под Android плюс
    # хостовая сборка tauri (webkit) — это десятки минут на пустом cargo-кэше.
    timeout-minutes: 90
    concurrency:
      group: zapiski-android-${{ github.ref }}
      # Пуш в ветку отменяет предыдущий прогон, а вот начатую сборку тега — нет:
      # её артефакт нужен job'у release.
      cancel-in-progress: ${{ github.ref_type != 'tag' }}

    env:
      # Флаг «есть куда доставить сборку». Считается здесь, а не в `if`
      # шага: контекст `secrets` в условиях шагов недоступен, и файл с
      # такой ссылкой GitHub отвергает целиком — прогон падает за секунду
      # с именем файла вместо названия workflow. В env у job'а secrets
      # разрешены, а env в условии шага — да.
      HAS_SERVER: ${{ secrets.SERVER_HOST != '' && secrets.SSH_PRIVATE_KEY != '' }}

    outputs:
      version: ${{ steps.version.outputs.version }}
      signed: ${{ steps.keystore.outputs.signed }}
      apk: ${{ steps.collect.outputs.name }}
      artifact: ${{ steps.collect.outputs.artifact }}
      channel: ${{ steps.channel.outputs.channel }}
      promoted: ${{ steps.channel.outputs.promoted }}
      # Единственный флаг, от которого зависит публикация. `signed` означает
      # лишь «keystore восстановился»; здесь — «готовый APK проверен и подписан
      # именно этим ключом».
      verified_release: ${{ steps.verify.outputs.verified_release }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Канал сборки ──────────────────────────────────────────────────────
      #
      # Считается ОДИН раз и в одном месте — до тяжёлых шагов. Дальше все
      # решения («падать ли без ключа», «можно ли трогать latest») читают этот
      # флаг, а не пересчитывают своё представление о production по-своему.
      - name: Канал сборки
        id: channel
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          INPUT_CHANNEL: ${{ inputs.channel }}
        run: node apps/mobile/scripts/android-release-gate.mjs channel

      # ── Инструменты ───────────────────────────────────────────────────────

      # Хостовая часть проверки (`cargo test`) собирает крейт `tauri` под
      # linux, а он тянет webkit2gtk-4.1 через pkg-config. В образе раннера
      # этих dev-пакетов нет, и без них шаг падает на этапе `build.rs` —
      # с сообщением про pkg-config, по которому не догадаешься, что дело в apt.
      # xmllint нужен самопроверке оверлея и проверке манифеста после патча.
      # Установка системных библиотек — единственный шаг сборки, который умеет
      # ВИСЕТЬ, а не падать, и однажды он встал на 74 минуты (run 32216709135:
      # 04:42 → 05:56, оборвался только вытеснением следующего push'а).
      #
      # Причина обычная для runner'ов GitHub: фоновые `apt-daily` и
      # `unattended-upgrades` держат блокировку dpkg, а `apt-get` ждёт её
      # БЕЗ ОГРАНИЧЕНИЯ по времени. Со стороны это неотличимо от «сборка
      # зависла», и заказчик так её и описал.
      #
      # Три меры, и каждая нужна:
      #   1. `timeout-minutes` — шаг не может съесть бюджет всей сборки;
      #   2. `DPkg::Lock::Timeout` — ждём блокировку минуту, потом падаем с
      #      внятной причиной вместо молчаливого ожидания;
      #   3. три попытки — зеркала пакетов иногда отвечают не с первого раза,
      #      и это не повод терять сборку целиком.
      - name: Системные библиотеки
        timeout-minutes: 12
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          # Фоновому обновлению здесь делать нечего: машина живёт минуты.
          sudo systemctl stop apt-daily.service apt-daily-upgrade.service unattended-upgrades.service 2>/dev/null || true
          sudo systemctl kill --kill-who=all apt-daily.service 2>/dev/null || true

          apt_try() {
            for attempt in 1 2 3; do
              if sudo apt-get -o DPkg::Lock::Timeout=60 "$@"; then return 0; fi
              echo "::warning::apt-get $1: попытка ${attempt} не удалась, повтор"
              sleep $((attempt * 15))
            done
            return 1
          }

          apt_try update
          apt_try install --no-install-recommends -y \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libxml2-utils \
            pkg-config

      - name: Установить pnpm
        uses: pnpm/action-setup@v4

      - name: Установить Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # JDK ровно 21, не «последний».
      #   * AGP 8.11 и Gradle 8.14 (их ставит шаблон Tauri) требуют минимум 17;
      #   * сгенерированный app/build.gradle.kts компилирует Kotlin и Java под
      #     target 1.8, а javac перестал принимать `-target 8` начиная с JDK 22.
      # То есть 17…21 — рабочий диапазон, 21 берём как верхнюю границу.
      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      # NDK: сначала смотрим, что уже распаковано в образе раннера (это
      # экономит ~2 ГБ загрузки), и только потом идём в sdkmanager. Если
      # зафиксированной версии нет нигде (Google их периодически убирает),
      # берём самую свежую и пишем в лог, какую именно, — чтобы сборку можно
      # было воспроизвести.
      - name: NDK
        run: |
          set -euo pipefail
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          [ -n "${sdk}" ] || { echo 'ни ANDROID_HOME, ни ANDROID_SDK_ROOT не заданы' >&2; exit 1; }

          preferred="${ZAPISKI_NDK_VERSION}"
          home=''

          # Порядок важен: сначала пин, и только потом что подвернётся. Иначе
          # сборка молча поедет на той версии, которую сегодня положили в образ,
          # и «у меня собиралось» перестанет что-либо значить.
          #
          # Без `yes |`: под `set -o pipefail` конвейер с `yes` падает по
          # SIGPIPE. Лицензии уже приняты действием setup-android, а
          # `</dev/null` гарантирует, что неожиданный запрос не подвесит job.
          if [ -d "${sdk}/ndk/${preferred}" ]; then
            home="${sdk}/ndk/${preferred}"
          elif sdkmanager --install "ndk;${preferred}" >/dev/null </dev/null; then
            home="${sdk}/ndk/${preferred}"
          else
            echo "::warning::NDK ${preferred} недоступен ни в образе, ни в sdkmanager — берём самый свежий из доступных"
            newest=''
            if [ -d "${sdk}/ndk" ]; then
              newest="$(ls -1 "${sdk}/ndk" | sort -V | tail -1)"
            fi
            if [ -n "${newest}" ]; then
              home="${sdk}/ndk/${newest}"
            else
              package="$(sdkmanager --list 2>/dev/null | awk -F'|' '/^[[:space:]]*ndk;/ {gsub(/[[:space:]]/,"",$1); print $1}' | sort -u -V | tail -1)"
              [ -n "${package}" ] || { echo 'sdkmanager не предлагает ни одного NDK' >&2; exit 1; }
              sdkmanager --install "${package}" >/dev/null </dev/null
              home="${sdk}/ndk/${package#ndk;}"
            fi
            echo "::warning::сборка идёт на NDK ${home##*/}, а не на зафиксированном ${preferred}"
          fi

          # source.properties читает сам tauri-cli: без него он падает с
          # «Failed to lookup version of installed NDK».
          [ -f "${home}/source.properties" ] || { echo "NDK не распакован в ${home}" >&2; exit 1; }
          echo "Взят NDK ${home}"

          # ANDROID_HOME нормализуем: setup-android заполняет обе переменные,
          # но полагаться на это в каждом шаге не хочется.
          {
            echo "ANDROID_HOME=${sdk}"
            echo "ANDROID_SDK_ROOT=${sdk}"
            # Tauri читает NDK_HOME, gradle-плагины — ANDROID_NDK_HOME/ROOT.
            echo "NDK_HOME=${home}"
            echo "ANDROID_NDK_HOME=${home}"
            echo "ANDROID_NDK_ROOT=${home}"
          } >> "$GITHUB_ENV"

      - name: Rust с таргетами Android
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal
          rustup default stable
          # Ровно те таргеты, которые собираются ниже (`--target aarch64
          # --target armv7`). x86-таргеты нужны только эмулятору: они
          # удваивают время сборки и вес APK, а бюджет — 30 МБ (ТЗ §6).
          rustup target add aarch64-linux-android armv7-linux-androideabi
          rustup show

      - name: Кэш cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/mobile/src-tauri/target
          key: android-cargo-${{ runner.os }}-${{ hashFiles('apps/mobile/src-tauri/Cargo.lock', 'apps/mobile/src-tauri/Cargo.toml') }}
          restore-keys: android-cargo-${{ runner.os }}-

      - name: Кэш pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: pnpm-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      # ── Зависимости и пакеты ──────────────────────────────────────────────
      # `--frozen-lockfile` — норма. Но лок-файл общий на весь монорепозиторий
      # и обновляется тем, кто первым коммитит новый пакет; пока apps/mobile в
      # него не попал, сборка Android не должна падать по чужой причине.
      # Поэтому падение фиксируется в логе предупреждением, а не молчанием.
      - name: Установка зависимостей
        run: |
          set -euo pipefail
          pnpm config set store-dir ~/.pnpm-store
          if pnpm install --frozen-lockfile; then
            echo 'Зависимости поставлены по лок-файлу.'
          else
            echo "::warning::pnpm-lock.yaml не покрывает воркспейс — ставим без --frozen-lockfile; обновите лок-файл в репозитории"
            pnpm install --no-frozen-lockfile
          fi

      - name: Сборка пакетов
        run: pnpm -r --filter "./packages/**" build

      - name: Проверка типов оболочки
        run: pnpm --filter @zapiski/mobile typecheck

      # Фронтенд собирается здесь, а не только внутри `tauri android build`:
      # ошибка в вебе должна падать до того, как раннер потратит полчаса на
      # Rust. `beforeBuildCommand` потом соберёт его ещё раз — это дёшево.
      - name: Сборка фронтенда
        run: pnpm --filter @zapiski/mobile build:vite

      # ── Проверки, которые не требуют устройства ───────────────────────────
      - name: Тесты Rust-части оболочки
        working-directory: apps/mobile/src-tauri
        run: cargo test

      # Патч AndroidManifest прогоняется на эталоне до того, как понадобится
      # настоящий: ошибка в патче иначе всплыла бы аварией сборки Gradle.
      # Kotlin компилируется только здесь, и забытый импорт стоит четырёх минут
      # сборки, а видно его в середине длинного лога. Этот шаг ловит такое за
      # секунду и до компиляции: пять прогонов подряд падали на отсутствующем
      # `import android.content.Intent`.
      - name: Импорты Kotlin
        run: pnpm --filter @zapiski/mobile android:kotlin:check

      - name: Самопроверка Android-оверлея
        run: pnpm --filter @zapiski/mobile android:overlay:selftest

      - name: Версия из tauri.conf.json
        id: version
        run: |
          set -euo pipefail
          version="$(node -p "require('./apps/mobile/src-tauri/tauri.conf.json').version")"
          tag="${GITHUB_REF_NAME}"
          if [ "${GITHUB_REF_TYPE}" = 'tag' ] && [ "zapiski-v${version}" != "${tag}" ]; then
            echo "Тег ${tag} не совпадает с версией ${version} в tauri.conf.json." >&2
            echo "Правило СИМПАС: тег релиза — zapiski-v${version}." >&2
            echo 'Версия в манифесте — источник истины для фида обновлений, разъезжаться им нельзя.' >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Версия сборки: ${version}"

      # ── Android-проект ────────────────────────────────────────────────────
      # gen/android генерируется здесь и в git не попадает (см. .gitignore и
      # комментарий в apply-android-overlay.mjs).
      - name: Сгенерировать проект Android
        run: pnpm --filter @zapiski/mobile exec tauri android init --ci --skip-targets-install

      # Оверлей копирует apps/mobile/android/app/src/main/res поверх
      # сгенерированного res и затирает одноимённые файлы. Единственное
      # пересечение — values/strings.xml. Сохраняем шаблонный файл ДО копирования,
      # чтобы следующий шаг вернул то, что оверлей не знает (см. ниже).
      - name: Сохранить ресурсы шаблона Tauri
        run: |
          set -euo pipefail
          main='apps/mobile/src-tauri/gen/android/app/src/main'
          cp "${main}/res/values/strings.xml" "${RUNNER_TEMP}/tauri-strings.xml"
          echo '── strings.xml шаблона ──'
          cat "${RUNNER_TEMP}/tauri-strings.xml"

      # compileSdk задаёт шаблон Tauri (сейчас 36), а не мы — поэтому читаем его
      # из сгенерированного gradle, а не зашиваем. Так при обновлении CLI
      # платформа доставится сама. Если пакета нет — не падаем: AGP умеет
      # докачивать SDK сам, лицензии приняты действием setup-android.
      - name: Доустановить компоненты SDK
        run: |
          set -euo pipefail
          gradle='apps/mobile/src-tauri/gen/android/app/build.gradle.kts'
          # tail, а не head: под `set -o pipefail` рано закрытый head роняет
          # конвейер по SIGPIPE — та же грабля, что и в шагах с find.
          compile="$(sed -n 's/.*compileSdk[[:space:]]*=[[:space:]]*\([0-9][0-9]*\).*/\1/p' "${gradle}" | tail -1)"
          [ -n "${compile}" ] || { echo "не удалось прочитать compileSdk из ${gradle}" >&2; exit 1; }
          echo "compileSdk из шаблона Tauri: ${compile}"

          for package in "platform-tools" "platforms;android-${compile}" "build-tools;${compile}.0.0"; do
            if sdkmanager --install "${package}" >/dev/null </dev/null; then
              echo "поставлен ${package}"
            else
              echo "::warning::не удалось поставить ${package} — AGP попробует скачать его сам во время сборки"
            fi
          done

      - name: Наложить оверлей оболочки
        run: pnpm --filter @zapiski/mobile android:overlay

      # ───────────────────────────────────────────────────────────────────────
      # ВРЕМЕННАЯ ЗАПЛАТА CI. Место ей — в apps/mobile/scripts/apply-android-
      # overlay.mjs; она здесь только потому, что этот прогон — первая в жизни
      # проекта встреча оверлея с настоящим генератором, а тот разошёлся с
      # эталоном `scripts/fixtures/AndroidManifest.generated.xml` в двух местах.
      # Оба расхождения ломают сборку намертво, оба проверены локально на
      # проекте, сгенерированном tauri-cli 2.11.4:
      #
      #  1. res/values/strings.xml. Шаблон Tauri держит там `app_name` И
      #     `main_activity_title`; оверлей копирует свой файл поверх, а в нём
      #     только `app_name`. Манифест шаблона ссылается на
      #     `@string/main_activity_title` → AAPT2 падает на «resource not found».
      #
      #  2. FileProvider. В эталоне его нет, а настоящий шаблон 2.11.4 объявляет
      #     свой: `androidx.core.content.FileProvider` с authorities
      #     `${applicationId}.fileprovider`. Оверлей добавляет ВТОРОЙ провайдер
      #     с тем же android:name — манифест-мержер такое не пропускает:
      #     «Element provider#androidx.core.content.FileProvider … duplicated
      #     with element declared at …» (проверено запуском com.android.
      #     manifmerger.Merger на пропатченном манифесте).
      #     Здесь мы сводим их в один: authorities складываются через `;`
      #     (FileProvider.getUriForFile резолвит любой из них), пути из
      #     file_provider_paths.xml переезжают в file_paths.xml.
      #
      # Шаг идемпотентен и самоотключается: как только оверлей научится делать
      # это сам, «нечего согласовывать» — и в лог ничего не попадёт.
      # ───────────────────────────────────────────────────────────────────────
      - name: Согласовать оверлей с шаблоном Tauri
        run: |
          set -euo pipefail
          cat > "${RUNNER_TEMP}/reconcile.mjs" <<'RECONCILE'
          import { existsSync, readFileSync, writeFileSync } from 'node:fs';
          import { join } from 'node:path';

          const MAIN = process.argv[2];
          const BACKUP = process.argv[3];
          const manifestPath = join(MAIN, 'AndroidManifest.xml');
          const stringsPath = join(MAIN, 'res', 'values', 'strings.xml');
          const notes = [];
          let manifest = readFileSync(manifestPath, 'utf8');

          // 1. Строки шаблона, затёртые оверлеем.
          if (existsSync(BACKUP) && existsSync(stringsPath)) {
            const template = readFileSync(BACKUP, 'utf8');
            const current = readFileSync(stringsPath, 'utf8');
            const lost = [...template.matchAll(/<string\s+name="([^"]+)"[\s\S]*?<\/string>/g)]
              .filter(([, name]) => !new RegExp(`<string\\s+name="${name}"`).test(current));
            if (lost.length > 0) {
              const block = lost.map(([xml]) => `    ${xml.trim()}`).join('\n');
              writeFileSync(stringsPath, current.replace(/([ \t]*)<\/resources>/, `${block}\n$1</resources>`), 'utf8');
              notes.push(`восстановлены строки шаблона: ${lost.map(([, name]) => name).join(', ')}`);
            }
          }

          // 2. Дубли androidx.core.content.FileProvider.
          const providers = [...manifest.matchAll(/[ \t]*<provider\b[\s\S]*?<\/provider>\n?/g)]
            .filter(([xml]) => xml.includes('android:name="androidx.core.content.FileProvider"'));

          if (providers.length > 1) {
            const attr = (xml, name) => (xml.match(new RegExp(`${name}="([^"]*)"`)) ?? [])[1] ?? '';
            const resource = (xml) => (xml.match(/android:resource="@xml\/([^"]*)"/) ?? [])[1] ?? '';

            const authorities = [...new Set(
              providers.flatMap(([xml]) => attr(xml, 'android:authorities').split(';')).filter(Boolean),
            )];
            const [keep] = providers[0];
            const target = join(MAIN, 'res', 'xml', `${resource(keep)}.xml`);
            let paths = readFileSync(target, 'utf8');

            for (const [xml] of providers.slice(1)) {
              const from = join(MAIN, 'res', 'xml', `${resource(xml)}.xml`);
              if (from === target || !existsSync(from)) continue;
              const entries = [...readFileSync(from, 'utf8').matchAll(/<(\w[\w-]*)\s+name="([^"]*)"[^>]*\/>/g)];
              const missing = entries.filter(([, tag, name]) => !new RegExp(`<${tag}\\b[^>]*name="${name}"`).test(paths));
              if (missing.length === 0) continue;
              paths = paths.replace(
                /([ \t]*)<\/paths>/,
                `${missing.map(([entry]) => `    ${entry}`).join('\n')}\n$1</paths>`,
              );
              notes.push(`пути ${resource(xml)} перенесены в ${resource(keep)}`);
            }
            writeFileSync(target, paths, 'utf8');

            manifest = manifest.replace(
              keep,
              keep.replace(/android:authorities="[^"]*"/, `android:authorities="${authorities.join(';')}"`),
            );
            for (const [xml] of providers.slice(1)) manifest = manifest.replace(xml, '');
            writeFileSync(manifestPath, manifest, 'utf8');
            notes.push(`FileProvider сведён в один, authorities: ${authorities.join(';')}`);
          }

          if (notes.length === 0) {
            console.log('нечего согласовывать — оверлей и шаблон сошлись');
          } else {
            for (const note of notes) console.log(`::warning::заплата CI: ${note} (место этой правки — apply-android-overlay.mjs)`);
          }
          RECONCILE

          main='apps/mobile/src-tauri/gen/android/app/src/main'
          node "${RUNNER_TEMP}/reconcile.mjs" "${main}" "${RUNNER_TEMP}/tauri-strings.xml"

          # Проверяем то, что реально уедет в Gradle, а не эталон.
          xmllint --noout "${main}/AndroidManifest.xml"
          xmllint --noout "${main}/res/values/strings.xml"
          echo '── AndroidManifest.xml, который пойдёт в сборку ──'
          cat "${main}/AndroidManifest.xml"

          # Висячая ссылка на строку — самая дешёвая в диагностике ошибка,
          # если поймать её здесь, и самая муторная, если ловить по логу AAPT2.
          missing=''
          for name in $(grep -o '@string/[A-Za-z0-9_]*' "${main}/AndroidManifest.xml" | sed 's|@string/||' | sort -u); do
            grep -q "name=\"${name}\"" "${main}/res/values/strings.xml" || missing="${missing} ${name}"
          done
          [ -z "${missing}" ] || { echo "в res/values/strings.xml нет строк:${missing}" >&2; exit 1; }
          echo 'Все @string/… из манифеста найдены в res/values/strings.xml'

      # Release-сборка идёт с `isMinifyEnabled = true` (так в шаблоне Tauri), а
      # Rust зовёт Kotlin по строковому имени класса — `env.call_static_method(
      # "ru/cmpas/zapiski/NativeBridge", …)` в src-tauri/src/android.rs. R8
      # такие вызовы не видит: он переименует класс и выкинет «неиспользуемые»
      # методы, и релизный APK соберётся, установится и упадёт при первом же
      # обращении к платформе. Правило кладём файлом: release-buildType в
      # app/build.gradle.kts подхватывает `fileTree(".") { include("**/*.pro") }`.
      - name: Правила R8 для нативного моста
        run: |
          set -euo pipefail
          identifier="$(node -p "require('./apps/mobile/src-tauri/tauri.conf.json').identifier")"
          rules='apps/mobile/src-tauri/gen/android/app/proguard-zapiski.pro'
          cat > "${rules}" <<RULES
          # Сгенерировано .github/workflows/build-android.yml.
          # Мост Rust ↔ Kotlin держится на именах: их нельзя ни переименовывать,
          # ни выкидывать как «неиспользуемые» — вызов приходит из JNI.
          -keep class ${identifier}.** { *; }
          -keepclasseswithmembernames class * { native <methods>; }
          RULES
          cat "${rules}"

      # ── Ключ подписи ──────────────────────────────────────────────────────
      #
      # ЗДЕСЬ БЫЛА ГЛАВНАЯ ДЫРА, из-за которой заказчику прилетало «Play Защита
      # блокирует установку».
      #
      # Шаг работал fail-open: нет секретов — не падаем, берём общеизвестный
      # ОТЛАДОЧНЫЙ ключ, собираем `--debug`, и дальше те же строки кладут
      # результат в `/updates/latest/zapiski.apk` — файл, который человек
      # качает по кнопке. То есть публичная ссылка могла отдавать пакет,
      # подписанный `CN=Android Debug`. Это первое, на что реагирует Play
      # Защита, и это же ломает обновление поверх релиза.
      #
      # Теперь правило одно и жёсткое: производственная сборка либо подписана
      # постоянным ключом из ANDROID_*, либо её нет. Половина комплекта —
      # отказ на любом канале: это ошибка настройки, а не повод собрать debug.
      - name: Подготовить keystore
        id: keystore
        env:
          CHANNEL: ${{ steps.channel.outputs.channel }}
          # Скрипту сообщается ЕСТЬ или НЕТ, а не значение: секретов он не видит.
          HAS_ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
          HAS_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD != '' }}
          HAS_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS != '' }}
          HAS_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD != '' }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          # Политика решается в проверяемом месте: `android-release-gate.mjs`
          # падает сам при неполном комплекте и при production без ключа.
          node apps/mobile/scripts/android-release-gate.mjs policy

          if [ -z "${ANDROID_KEYSTORE_BASE64}" ]; then
            echo "::warning::Секретов подписи нет — собираем DEBUG-APK для разработки"
            echo "::warning::Debug-APK НИКОГДА не публикуется: ни в /updates/latest/, ни в latest.json, ни в GitHub Release"

            # ПОСТОЯННЫЙ отладочный ключ вместо случайного.
            #
            # Свой ключ Android-плагин генерирует на машине сборки. Раннер
            # GitHub каждый раз новый — значит, новый ключ и новая подпись.
            # Первый APK встаёт, каждый следующий отказывается: Android не
            # ставит пакет с тем же applicationId, но чужой подписью, и пишет
            # «Приложение не установлено», не называя причины. Заказчик потерял
            # на этом вечер.
            #
            # Ключ отладочный, общеизвестный (android/androiddebugkey), ничего
            # не защищает и в Play не принимается — почему это не утечка,
            # написано в apps/mobile/keys/README.md.
            mkdir -p ~/.android
            base64 -d apps/mobile/keys/debug.keystore.base64 > ~/.android/debug.keystore
            keytool -list -keystore ~/.android/debug.keystore -storepass android \
              -alias androiddebugkey | tail -2
            echo "::warning::latest.json по этой сборке не публикуется — иначе клиенты пошли бы обновляться на пакет с чужой подписью"
            exit 0
          fi

          umask 077
          mkdir -p "${RUNNER_TEMP}/signing"
          keystore="${RUNNER_TEMP}/signing/zapiski.jks"
          printf '%s' "${ANDROID_KEYSTORE_BASE64}" | base64 -d > "${keystore}"
          # Файл есть и не пуст: base64 с опечаткой даёт нулевой размер, и без
          # этой строчки отказ всплыл бы получасом позже, на подписи.
          test -s "${keystore}"
          # Проверяем ключ до сборки: полчаса компиляции ради «пароль не
          # подошёл» в самом конце — плохая сделка. Проверяются обе двери:
          # пароль хранилища и пароль самого ключа.
          keytool -list -keystore "${keystore}" \
            -storepass "${ANDROID_KEYSTORE_PASSWORD}" -alias "${ANDROID_KEY_ALIAS}" >/dev/null
          # `-certreq` требует ПРИВАТНЫЙ ключ и ничего не меняет в хранилище:
          # проверка пароля ключа, которая не портит то, что проверяет.
          # (`-keypasswd` сделал бы то же самое, но записью в keystore.)
          keytool -certreq -keystore "${keystore}" \
            -storepass "${ANDROID_KEYSTORE_PASSWORD}" -alias "${ANDROID_KEY_ALIAS}" \
            -keypass "${ANDROID_KEY_PASSWORD}" >/dev/null 2>&1 \
            || { echo '::error::ANDROID_KEY_PASSWORD не подходит к алиасу ANDROID_KEY_ALIAS'; exit 1; }

          # Отпечаток ожидаемой подписи — из САМОГО keystore, до сборки.
          #
          # Это точка отсчёта: после подписи с ним сверяется отпечаток готового
          # APK. Публичный отпечаток сертификата секретом не является и в лог
          # печатается сознательно — по нему заказчик сверяет, что выпуск
          # подписан тем же ключом, что и прошлый.
          expected="$(LANG=C keytool -list -v -keystore "${keystore}" \
            -storepass "${ANDROID_KEYSTORE_PASSWORD}" -alias "${ANDROID_KEY_ALIAS}" \
            | awk -F'SHA256: ' '/SHA256:/ { gsub(":", "", $2); print tolower($2); exit }')"
          test -n "${expected}"
          echo "EXPECTED_SIGNER_SHA256=${expected}" >> "$GITHUB_ENV"
          echo "expected_signer_sha256=${expected}" >> "$GITHUB_OUTPUT"
          echo 'signed=true' >> "$GITHUB_OUTPUT"
          # Тот же отпечаток лежит в репозитории и уезжает на сайт файлом
          # подтверждения App Links (`apps/web/public/.well-known/assetlinks.json`).
          # Если ключ подписи сменится, а файл останется прежним, Android
          # перестанет отдавать приложению ссылку из письма — и сломается это
          # МОЛЧА: сборка зелёная, APK ставится, а вход по почте уводит в
          # браузер. Поэтому расхождение — отказ сборки, а не предупреждение.
          repo_fp="$(tr -d '[:space:]' < apps/mobile/EXPECTED_SIGNER.txt)"
          if [ "${repo_fp}" != "${expected}" ]; then
            echo "::error::Отпечаток ключа подписи разошёлся с apps/mobile/EXPECTED_SIGNER.txt"
            echo "  keystore:                        ${expected}"
            echo "  apps/mobile/EXPECTED_SIGNER.txt: ${repo_fp}"
            echo '  Пока они не совпадут, вход по ссылке из письма на Android будет открывать браузер.'
            echo '  Лечение: если ключ сменён сознательно — обновить EXPECTED_SIGNER.txt и assetlinks.json.'
            exit 1
          fi

          echo 'Ключ подписи на месте, алиас найден, пароль ключа подходит.'
          echo "Expected signer SHA-256: ${expected}"
          echo 'Отпечаток совпал с apps/mobile/EXPECTED_SIGNER.txt — App Links подтверждаются тем же ключом.'

      # ── Сборка ────────────────────────────────────────────────────────────
      - name: tauri android build
        env:
          # Отладочный профиль cargo кладёт в .so полную отладочную информацию,
          # а шаблон Tauri просит AGP её не срезать (`jniLibs.keepDebugSymbols`).
          # Два таких .so дают APK в сотни мегабайт — при том, что квота
          # артефактов аккаунта уже упиралась в потолок. Символы debug-сборке не
          # нужны (отлаживают Rust не по APK), поэтому режем их через штатный
          # оверрайд профиля. На release-профиль эти переменные не влияют.
          CARGO_PROFILE_DEV_DEBUG: 'false'
          CARGO_PROFILE_DEV_STRIP: 'symbols'
        run: |
          set -euo pipefail
          # `release` — не «если получится», а следствие политики: до этого
          # шага production без ключа уже упал. Дорога «production → нет
          # секретов → --debug» в этом файле отсутствует физически.
          if [ "${{ steps.keystore.outputs.build_type }}" = 'release' ]; then
            pnpm --filter @zapiski/mobile exec tauri android build --apk \
              --target aarch64 --target armv7
          else
            pnpm --filter @zapiski/mobile exec tauri android build --apk --debug \
              --target aarch64 --target armv7
          fi

          echo '── что собралось ──'
          find apps/mobile/src-tauri/gen/android/app/build/outputs -name '*.apk' -type f -printf '%p\t%s байт\n'

      # ── Подпись ───────────────────────────────────────────────────────────
      # Подписываем сами, а не конфигом Gradle: сгенерированный build.gradle.kts
      # — чужой файл, править его патчем ради подписи рискованнее, чем вызвать
      # штатные zipalign и apksigner. Заодно получаем `verify --print-certs`,
      # то есть доказательство стабильности подписи прямо в логе.
      - name: Подписать APK
        id: sign
        if: steps.keystore.outputs.signed == 'true'
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          # Размер массива проверяем ДО обращения к элементу: под `set -u`
          # `${arr[-1]:-}` на пустом массиве не отдаёт пустую строку, а роняет
          # шаг с «bad array subscript», и заготовленное сообщение об ошибке
          # уже не печатается.
          mapfile -t versions < <(find "${ANDROID_HOME}/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V)
          [ "${#versions[@]}" -gt 0 ] || { echo 'build-tools не установлены' >&2; exit 1; }
          tools="${versions[-1]}"
          echo "build-tools: ${tools}"

          # Флавор один (`universal`), профиль — release: путь предсказуем.
          # mapfile, а не `find | head`: под `set -o pipefail` закрытый head
          # роняет конвейер по SIGPIPE, и шаг падает без внятной причины.
          mapfile -t found < <(find 'apps/mobile/src-tauri/gen/android/app/build/outputs/apk/universal/release' -name '*.apk' -type f | sort)
          [ "${#found[@]}" -gt 0 ] || { echo 'release-APK не найден после сборки' >&2; exit 1; }
          unsigned="${found[0]}"
          echo "Подписываем ${unsigned}"

          "${tools}/zipalign" -p -f 4 "${unsigned}" "${RUNNER_TEMP}/aligned.apk"
          # Схемы названы явно, а не отданы на усмотрение инструмента:
          # v2 обязательна (при minSdk 24 без неё пакет проверяется только
          # JAR-подписью), v3 даёт возможность когда-нибудь сменить ключ без
          # переустановки, v1 оставлен ради совместимости со старым софтом,
          # который читает APK как обычный zip. v4 не нужна: она про
          # инкрементальную установку с ADB, а не про sideload.
          "${tools}/apksigner" sign \
            --ks "${RUNNER_TEMP}/signing/zapiski.jks" \
            --ks-pass "pass:${ANDROID_KEYSTORE_PASSWORD}" \
            --ks-key-alias "${ANDROID_KEY_ALIAS}" \
            --key-pass "pass:${ANDROID_KEY_PASSWORD}" \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out "${RUNNER_TEMP}/signed.apk" \
            "${RUNNER_TEMP}/aligned.apk"
          echo "apksigner=${tools}/apksigner" >> "$GITHUB_OUTPUT"

      # ── Проверка готового APK ─────────────────────────────────────────────
      #
      # Раньше здесь просто печатался сертификат. Печать в лог — не проверка:
      # её никто не читает, и ни одно решение от неё не зависело. Теперь это
      # ВОРОТА: только пройденная проверка открывает публикацию.
      #
      # Проверяется готовый распространяемый файл, а не намерение. «Keystore
      # восстановился» и «APK подписан этим ключом» — разные утверждения, и до
      # сих пор проверялось только первое.
      - name: Проверить подпись APK
        id: verify
        if: steps.keystore.outputs.signed == 'true'
        env:
          EXPECTED_SIGNER_SHA256: ${{ steps.keystore.outputs.expected_signer_sha256 }}
        run: |
          set -uo pipefail
          apksigner='${{ steps.sign.outputs.apksigner }}'
          set +e
          "${apksigner}" verify --verbose --print-certs "${RUNNER_TEMP}/signed.apk" \
            > "${RUNNER_TEMP}/apksigner.txt" 2>&1
          code=$?
          set -e
          cat "${RUNNER_TEMP}/apksigner.txt"

          node apps/mobile/scripts/android-release-gate.mjs verify \
            --output "${RUNNER_TEMP}/apksigner.txt" \
            --expected "${EXPECTED_SIGNER_SHA256}" \
            --exit-code "${code}"

      # ── Сторож имён и разрешений ГОТОВОГО пакета ─────────────────────────
      #
      # Оба проверяются по СОБРАННОМУ файлу, а не по шаблону: Tauri генерирует
      # манифест сам, и разрешение может приехать из зависимости, которую никто
      # не звал. Шаблон при этом останется чистым.
      - name: Разрешения собранного APK против списка
        run: |
          set -euo pipefail
          apk="${RUNNER_TEMP}/signed.apk"
          [ -f "${apk}" ] || apk="$(find apps/mobile/src-tauri/gen/android/app/build/outputs -name '*.apk' -type f | sort | head -1)"
          [ -n "${apk}" ] || { echo 'APK не найден — нечего проверять' >&2; exit 1; }

          # aapt2 лежит в build-tools; версия каталога плавает между образами.
          aapt="$(find "${ANDROID_HOME}/build-tools" -maxdepth 2 -name 'aapt2' -type f | sort -V | tail -1)"
          [ -n "${aapt}" ] || { echo 'aapt2 не найден в build-tools' >&2; exit 1; }

          "${aapt}" dump permissions "${apk}" > "${RUNNER_TEMP}/permissions.txt"
          echo '── что напечатал aapt2 ──'
          cat "${RUNNER_TEMP}/permissions.txt"

          node apps/mobile/scripts/android-release-gate.mjs permissions \
            --list apps/mobile/android-permissions.txt \
            --dump "${RUNNER_TEMP}/permissions.txt"

      - name: Собрать артефакт
        id: collect
        run: |
          set -euo pipefail
          version='${{ steps.version.outputs.version }}'
          mkdir -p artifacts

          if [ "${{ steps.keystore.outputs.build_type }}" = 'release' ]; then
            name="simpas-zapiski-${version}.apk"
            artifact="simpas-zapiski-android-${version}"
            cp "${RUNNER_TEMP}/signed.apk" "artifacts/${name}"
          else
            # `-debug` и в имени файла, и в имени артефакта: тот, кто скачает
            # его из вкладки Actions, обязан понимать, что это не релиз.
            name="simpas-zapiski-${version}-debug.apk"
            artifact="simpas-zapiski-android-${version}-debug"
            mapfile -t found < <(find 'apps/mobile/src-tauri/gen/android/app/build/outputs/apk/universal/debug' -name '*.apk' -type f | sort)
            [ "${#found[@]}" -gt 0 ] || { echo 'debug-APK не найден после сборки' >&2; exit 1; }
            cp "${found[0]}" "artifacts/${name}"
          fi

          size="$(stat -c%s "artifacts/${name}")"
          apk_sha256="$(sha256sum "artifacts/${name}" | cut -d' ' -f1)"
          echo "name=${name}" >> "$GITHUB_OUTPUT"
          echo "artifact=${artifact}" >> "$GITHUB_OUTPUT"
          echo "apk_sha256=${apk_sha256}" >> "$GITHUB_OUTPUT"
          echo "Артефакт: ${artifact} → ${name}, размер: $((size / 1024 / 1024)) МБ"

          # Имя по правилу СИМПАС — падаем здесь, а не после публикации.
          node apps/mobile/scripts/android-release-gate.mjs names \
            --artifact "${name}" \
            --version "${version}" \
            --debug "$([ "${{ steps.keystore.outputs.build_type }}" = 'release' ] && echo false || echo true)" \
            --tag "$([ "${GITHUB_REF_TYPE}" = 'tag' ] && echo "${GITHUB_REF_NAME}" || echo '')"
          echo "APK SHA-256: ${apk_sha256}"

          # Паспорт сборки: чем подписано и из чего собрано.
          #
          # Едет рядом с APK и в GitHub Release. Секретов в нём нет и быть не
          # может — только два публичных отпечатка, версия и ссылка на коммит.
          # Нужен затем, что «мы подписали правильным ключом» и «вот этот файл
          # подписан вот этим ключом» — разные утверждения, и второе обязано
          # оставаться доказуемым после того, как прогон истёк.
          node apps/mobile/scripts/android-release-gate.mjs provenance \
            --out "artifacts/${artifact}.json" \
            --channel '${{ steps.channel.outputs.channel }}' \
            --version "${version}" \
            --application-id "$(node -p "require('./apps/mobile/src-tauri/tauri.conf.json').identifier")" \
            --apk-sha256 "${apk_sha256}" \
            --signer-sha256 '${{ steps.verify.outputs.signer_sha256 }}' \
            --build-type "${{ steps.keystore.outputs.build_type }}"
          # ТЗ §6: APK <30 МБ. Не роняем сборку — сообщаем, чтобы бюджет не
          # переползли молча. Debug тяжелее release по определению, поэтому для
          # него это заметка, а не претензия.
          if [ "${size}" -gt 31457280 ]; then
            if [ "${{ steps.keystore.outputs.build_type }}" = 'release' ]; then
              echo "::warning::APK больше 30 МБ (${size} байт) — бюджет ТЗ §6 превышен"
            else
              echo "::notice::debug-APK больше 30 МБ (${size} байт); бюджет ТЗ §6 меряется по release-сборке"
            fi
          fi

      # ── Две дороги наружу ────────────────────────────────────────────────
      #
      # То же, что в сборке Windows, и по той же причине: квота хранилища
      # артефактов одна на весь аккаунт, и когда она полная, upload-artifact
      # отвечает отказом за секунду — уже собранный APK при этом годен.
      # Падение любой одной дороги сборку не роняет; падение обеих — роняет.
      #
      # 7 дней, а не 90 по умолчанию: нужен APK надолго — он приезжает в
      # GitHub Release по тегу, а не из вкладки Actions.
      - name: Приложить APK
        id: artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.collect.outputs.artifact }}
          path: |
            artifacts/*.apk
            artifacts/*.json
          if-no-files-found: error
          retention-days: 7

      # Каталог сборок, а не фид обновлений: debug-подпись рядом с latest.json
      # заставила бы клиентов ставить отладочный пакет поверх релизного —
      # Android откажет, а пользователь увидит вечное «доступно обновление».
      # `timeout-minutes` — не перестраховка, а разбор случившегося.
      #
      # Прогон 162 простоял на этом шаге больше получаса: APK был собран,
      # подписан и приложен к прогону, а выкладка молча висела. Упади она
      # сразу — следующий шаг («APK должен быть хоть где-то») разобрался бы
      # сам: на ветке, чьи сборки предлагает промостраница, он валит прогон, на
      # прочих печатает предупреждение и отпускает. Вместо этого job тянулся к
      # своему потолку, и человек, ждущий сборку, видел вечное «идёт».
      #
      # Пять минут — с большим запасом: APK около сорока мегабайт, обычная
      # выкладка укладывается в десятки секунд.
      - name: Отдать APK на сервер
        id: ship
        continue-on-error: true
        timeout-minutes: 5
        if: env.HAS_SERVER == 'true'
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          CHANNEL: ${{ steps.channel.outputs.channel }}
          PROMOTED: ${{ steps.channel.outputs.promoted }}
          VERIFIED: ${{ steps.verify.outputs.verified_release }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "${SSH_PRIVATE_KEY}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # `-T 10`: у самого ssh-keyscan свой таймаут, и без него первым
          # висел бы он.
          ssh-keyscan -T 10 -H "${SERVER_HOST}" >> ~/.ssh/known_hosts 2>/dev/null

          # Настройки задаются файлом, а не флагами у каждой команды: их здесь
          # четыре — два ssh, один scp и heredoc, — и добавить флаг в три
          # места из четырёх было бы ровно тем дефектом, который мы чиним.
          # scp читает тот же ~/.ssh/config.
          #
          # BatchMode отменяет любой интерактивный вопрос. Без него ssh, не
          # приняв ключ, спрашивает пароль — и ждёт ответа, которого на раннере
          # не будет никогда. Это и есть «висит молча».
          #
          # ConnectTimeout закрывает установку связи, ServerAlive* — уже
          # установленную. Разница существенная: прогон 162 до сервера дошёл
          # (соседние прогоны выкладывались успешно), а встал посреди разговора,
          # и один ConnectTimeout его бы не спас.
          cat >> ~/.ssh/config <<'SSHCFG'
          Host *
            BatchMode yes
            ConnectTimeout 15
            ServerAliveInterval 15
            ServerAliveCountMax 4
          SSHCFG
          chmod 600 ~/.ssh/config

          slug="$(printf '%s' "${GITHUB_REF_NAME}" | tr -c 'A-Za-z0-9-' '-' | cut -c1-60)"
          target="/var/www/zapiski.cmpas.ru/updates/builds/${slug}"

          ssh -i ~/.ssh/deploy_key "${SERVER_USER}@${SERVER_HOST}" "mkdir -p '${target}'"
          scp -i ~/.ssh/deploy_key artifacts/*.apk "${SERVER_USER}@${SERVER_HOST}:${target}/"
          echo "APK лежит в ${target} — https://zapiski.cmpas.ru/updates/builds/${slug}/"

          # ── Ворота пользовательского канала ─────────────────────────────
          #
          # ЗДЕСЬ БЫЛА ВТОРАЯ ПОЛОВИНА ДЫРЫ. Ниже лежит копирование в
          # `/updates/latest/zapiski.apk` — файл, который отдаёт кнопка
          # «Скачать» на промостранице. Раньше сюда доезжала ЛЮБАЯ сборка,
          # включая отладочную с чужой ветки: каталог сборок и постоянная
          # ссылка обновлялись одними и теми же строками.
          #
          # Теперь дорога открыта только производственной сборке, чья подпись
          # проверена на готовом файле. Всё остальное останавливается здесь и
          # живёт в каталоге сборок, откуда его берут руками и осознанно.
          if [ "${PROMOTED}" != 'true' ] || [ "${VERIFIED}" != 'true' ]; then
            echo "Канал: ${CHANNEL}; подпись проверена: ${VERIFIED:-false}."
            echo '::notice::Постоянная ссылка /updates/latest/zapiski.apk НЕ обновляется: это не проверенная производственная сборка.'
            echo 'Production publish gate: CLOSED'
            exit 0
          fi
          echo 'Production publish gate: OPEN'

          # Постоянный адрес свежей сборки.
          #
          # Каталог сборок называется по ветке, а файл внутри — по версии:
          # дать такую ссылку человеку нельзя, она протухает следующим же
          # выпуском. Промостраница и письма ссылаются на постоянный адрес, а
          # он всегда указывает на последнее, что сюда приехало.
          latest="/var/www/zapiski.cmpas.ru/updates/latest"
          # Копия СВЕРЯЕТСЯ, а не просто делается.
          #
          # Промостраница отдаёт ровно этот файл, и молчаливо устаревший он
          # хуже отсутствующего: человек скачивает вчерашнюю сборку, находит в
          # ней починенный дефект и пишет, что мы ничего не сделали. Поэтому
          # после копирования сравниваются суммы, и расхождение валит шаг.
          ssh -i ~/.ssh/deploy_key "${SERVER_USER}@${SERVER_HOST}" sh -s -- "${target}" "${latest}" <<'REMOTE'
          set -eu
          target="$1"
          latest="$2"
          apk="$(ls -t "${target}"/*.apk | head -1)"
          mkdir -p "${latest}"
          cp -f "${apk}" "${latest}/zapiski.apk.part"
          mv "${latest}/zapiski.apk.part" "${latest}/zapiski.apk"
          chmod 644 "${latest}/zapiski.apk"
          built="$(sha256sum "${apk}" | cut -d' ' -f1)"
          served="$(sha256sum "${latest}/zapiski.apk" | cut -d' ' -f1)"
          [ "${built}" = "${served}" ] || {
            echo "постоянная ссылка отдаёт не тот файл: ${served} вместо ${built}" >&2
            exit 1
          }
          printf '%s  zapiski.apk\n' "${built}" > "${latest}/zapiski.apk.sha256"
          echo "updates/latest/zapiski.apk = $(basename "${apk}"), sha256 ${built}"
          REMOTE
          echo "Постоянная ссылка: https://zapiski.cmpas.ru/updates/latest/zapiski.apk"

      - name: APK должен быть хоть где-то
        env:
          ARTIFACT: ${{ steps.artifact.outcome }}
          SHIP: ${{ steps.ship.outcome }}
          # Канал считается ОДИН раз, в шаге «Канал сборки». Раньше здесь
          # стояло своё выражение — вторая версия того же правила, и разойтись
          # они могли молча.
          PROMOTED: ${{ steps.channel.outputs.promoted }}
        run: |
          set -euo pipefail
          echo "Артефакт GitHub: ${ARTIFACT}; сервер: ${SHIP}."
          if [ "${ARTIFACT}" = 'success' ] || [ "${SHIP}" = 'success' ]; then
            if [ "${ARTIFACT}" != 'success' ]; then
              echo '::warning::Артефакт GitHub не сохранён (обычная причина — исчерпанная квота хранилища аккаунта). APK забирайте с сервера.'
            fi
            if [ "${SHIP}" != 'success' ] && [ "${SHIP}" != 'skipped' ]; then
              # На ветке, чьи сборки предлагает промостраница, неудачная
              # доставка — не предупреждение, а провал.
              #
              # Раньше здесь стояло только `::warning::`, и это была тихая
              # ложь: прогон зелёный, письмо со ссылкой отправлено, а
              # /updates/latest/ держит вчерашний файл. Человек скачивает
              # старую сборку, находит в ней уже починенный дефект и пишет,
              # что мы ничего не сделали. Ветка при этом важна: на чужой ветке
              # или в PR отсутствие сервера — норма, там артефакта достаточно.
              if [ "${PROMOTED}" = 'true' ]; then
                echo "::error::APK не уехал на сервер, а промостраница отдаёт именно его — https://zapiski.cmpas.ru/updates/latest/zapiski.apk остался прежним. Ссылка обещает свежую сборку и врёт."
                exit 1
              fi
              echo '::warning::APK не уехал на сервер. Он есть в артефактах прогона.'
            fi
            exit 0
          fi
          echo '::error::APK собран, но не сохранён нигде: и артефакт, и доставка на сервер не удались. Скачать нечего.'
          exit 1

      - name: Убрать ключ подписи
        if: always()
        run: rm -rf "${RUNNER_TEMP}/signing" "${RUNNER_TEMP}/signed.apk" "${RUNNER_TEMP}/aligned.apk"

  # ───────────────────────────────────────────────────────────────────────────
  # RELEASE — только на теге и только для подписанной сборки
  # ───────────────────────────────────────────────────────────────────────────
  # Второе условие — не перестраховка. Без ключа job build даёт debug-APK;
  # опубликовать его как релиз значит выложить latest.json, по которому клиенты
  # пойдут ставить пакет с отладочной подписью. Android откажет в установке
  # поверх релиза, а пользователь увидит бесконечное «доступно обновление».
  release:
    name: Релиз и выкладка
    needs: build
    # `verified_release`, а не `signed`. Второе означает лишь «keystore
    # восстановился»; публиковать людям можно только то, чья подпись проверена
    # на ГОТОВОМ файле: не отладочная, совпадающая с ключом, со схемой v2.
    if: github.ref_type == 'tag' && needs.build.outputs.verified_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    # Общая группа с деплоем сервера: выкладку в /var/www делает кто-то один.
    concurrency:
      group: zapiski-server
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Забрать APK
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: artifacts

      - name: Опубликовать в GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if gh release view "${tag}" >/dev/null 2>&1; then
            gh release upload "${tag}" artifacts/*.apk artifacts/*.json --clobber
          else
            gh release create "${tag}" artifacts/*.apk artifacts/*.json \
              --title "ЗАПИСКИ ${{ needs.build.outputs.version }}" \
              --generate-notes
          fi

      # ── Выкладка на сервер ────────────────────────────────────────────────
      # Без неё автообновление не заработает: клиент ходит за манифестом на
      # zapiski.cmpas.ru, а сам APK качает оттуда же.
      # Те же настройки, что и в выкладке сборки, и по той же причине: висящий
      # ssh не сообщает о себе ничем. Здесь это дороже — молчащий шаг держит
      # выпуск, а не одну сборку.
      - name: Загрузить SSH-ключ
        timeout-minutes: 2
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -T 10 -H "${{ secrets.SERVER_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
          cat >> ~/.ssh/config <<'SSHCFG'
          Host *
            BatchMode yes
            ConnectTimeout 15
            ServerAliveInterval 15
            ServerAliveCountMax 4
          SSHCFG
          chmod 600 ~/.ssh/config

      - name: Собрать манифест обновления
        timeout-minutes: 3
        run: |
          set -euo pipefail
          version='${{ needs.build.outputs.version }}'
          apk='${{ needs.build.outputs.apk }}'

          # Текущий манифест с сервера: в нём может лежать релиз Windows той же
          # версии, и затирать его нельзя.
          ssh -i ~/.ssh/deploy_key \
            "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" \
            'cat /var/www/zapiski.cmpas.ru/updates/latest.json 2>/dev/null || echo "{}"' > current.json

          VERSION="${version}" APK="${apk}" NOTES="$(git tag -l --format='%(contents)' "${GITHUB_REF_NAME}")" \
          node - <<'NODE' > latest.json
          const fs = require('fs');

          const version = process.env.VERSION;
          const url = `https://zapiski.cmpas.ru/updates/${process.env.APK}`;

          let current = {};
          try {
            current = JSON.parse(fs.readFileSync('current.json', 'utf8')) || {};
          } catch {
            current = {};
          }

          // Платформы прошлой версии переносим, только если версия та же:
          // ссылка на .msi версии 0.2.0 в манифесте 0.3.0 отправила бы
          // пользователей Windows качать старый установщик как новый.
          const platforms = current.version === version && current.platforms
            ? { ...current.platforms }
            : {};
          platforms['android-universal'] = { signature: '', url };

          const manifest = {
            version,
            notes: (process.env.NOTES || '').trim(),
            pub_date: new Date().toISOString(),
            platforms,
          };
          process.stdout.write(JSON.stringify(manifest, null, 2) + '\n');
          NODE

          echo '── latest.json ──'
          cat latest.json

      - name: Выложить APK и фид
        timeout-minutes: 5
        run: |
          set -euo pipefail
          apk='${{ needs.build.outputs.apk }}'
          target="${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}"

          ssh -i ~/.ssh/deploy_key "${target}" 'mkdir -p /var/www/zapiski.cmpas.ru/updates'

          # APK кладём под временным именем и переименовываем: клиент,
          # скачавший половину файла, получил бы битый пакет.
          scp -i ~/.ssh/deploy_key "artifacts/${apk}" \
            "${target}:/var/www/zapiski.cmpas.ru/updates/${apk}.part"
          scp -i ~/.ssh/deploy_key latest.json \
            "${target}:/var/www/zapiski.cmpas.ru/updates/latest.json.part"

          ssh -i ~/.ssh/deploy_key "${target}" "bash -s" <<REMOTE
          set -Eeuo pipefail
          cd /var/www/zapiski.cmpas.ru/updates
          mv "${apk}.part" "${apk}"
          # Манифест переезжает последним: до этого момента клиенты видят
          # старую версию, а не ссылку на ещё не доехавший файл.
          mv latest.json.part latest.json
          chmod 644 "${apk}" latest.json
          ls -la
          REMOTE

          echo "::notice::APK и latest.json выложены в /var/www/zapiski.cmpas.ru/updates/"
          echo "::notice::Фид API отдаёт этот манифест, только если UPDATES_MANIFEST_PATH указывает на /var/www/zapiski.cmpas.ru/updates/latest.json (переменная стека API, см. deploy/)."

      - name: Убрать SSH-ключ
        if: always()
        run: rm -f ~/.ssh/deploy_key
