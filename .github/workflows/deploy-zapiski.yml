name: Деплой zapiski.cmpas.ru

# Регулярная выкладка КОМПАС.ЗАПИСОК:
#   preflight — типы, тесты, сборка PWA на раннере;
#   deploy    — статика едет rsync'ом в /var/www/zapiski.cmpas.ru,
#               API-стек поднимается на сервере из /var/www/zapiski.
#
# ПОЧЕМУ ЭТО НЕ МОЖЕТ ЗАДЕТЬ КОМПАС.Дневник:
#   * nginx здесь не упоминается вообще. Конфиг ставится один раз
#     провижном (provision-zapiski.yml) — обычный деплой к веб-серверу
#     не подходит (ADR-0003 §5).
#   * rsync пишет строго в /var/www/zapiski.cmpas.ru (ADR-0003 §1).
#     Каталог /var/www/cmpas.ru в этом файле не встречается.
#   * На сервере запускается только deploy/deploy-production-remote.sh,
#     который работает с compose-проектом `zapiski` (ADR-0003 §3).
#   * Порт для API — 3100, публикуется на loopback. 3000 и 25 не трогаем
#     (ADR-0003 §2, §7).
#
# Перед первым запуском обязателен provision-zapiski.yml — см. deploy/SETUP.md.

# ВНИМАНИЕ про ветки. Веткой по умолчанию в этом репозитории пока является
# не `main`, а рабочая ветка (репозиторий создан пустым, и default_branch стала
# первая запушенная). Фильтры `branches` ниже намеренно оставлены на `main` —
# они начнут работать, когда ветка приедет в `main`. До тех пор выкладка
# запускается вручную через workflow_dispatch: job `deploy` пускает к серверу
# только ref, равный github.event.repository.default_branch, поэтому ручной
# запуск с рабочей ветки проходит, а с любой посторонней — нет.
# Автовыкладку на каждый push в рабочую ветку сознательно НЕ включаем: на этом
# же сервере крутится чужой боевой КОМПАС.Дневник, и выкатывать туда каждый
# промежуточный коммит соседних агентов — плохая идея (ADR-0003).
on:
  # Ветка по умолчанию у этого репозитория — НЕ `main`: репозиторий создавался
  # пустым, и веткой по умолчанию стала первая запушенная. Одного `main` здесь
  # хватало ровно на то, чтобы деплой не запускался никогда и молча — за всё
  # время он стартовал только руками через workflow_dispatch. Имя перечислено
  # буквально, потому что в `on:` выражения не работают; так же сделано в
  # build-android.yml. Переименуете ветку по умолчанию — правьте здесь.
  #
  # Выкладку это не расширяет: job `deploy` всё равно проверяет, что ref равен
  # ветке по умолчанию репозитория.
  push:
    branches:
      - main
      - claude/cloud-deployment-cross-platform-9nenw7
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.github/workflows/provision-zapiski.yml'
  pull_request:
    branches:
      - main
      - claude/cloud-deployment-cross-platform-9nenw7
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.github/workflows/provision-zapiski.yml'
  workflow_dispatch:

permissions:
  contents: read

# Concurrency объявлена на уровне job'ов, а не workflow: проверки можно
# отменять при новом пуше, а вот job `deploy` делит группу `zapiski-server`
# с provision-zapiski.yml, чтобы провижн и деплой никогда не выполнялись
# одновременно (иначе деплой может стартовать раньше, чем появится docroot).

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # PREFLIGHT
  # ───────────────────────────────────────────────────────────────────────────
  # Монорепо разворачивается постепенно, поэтому шаги включаются сами, когда
  # соответствующий пакет появляется. Принцип: НЕ глушим ошибки — определяем,
  # существует ли скрипт, и если существует, то его падение валит сборку.
  # `|| true` тут нет нигде.
  preflight:
    name: Проверки и сборка PWA
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Русские имена файлов обязаны работать в браузерных прогонах.
    #
    # В окружении с локалью POSIX хранилище браузера (OPFS) отказывается
    # заводить файл с кириллическим именем: `getFileHandle('Идеи.md')` падает
    # с TypeMismatchError, хотя `Идеи.md` — обычное имя заметки у нашего
    # пользователя. Прогон при этом рапортует о поломке продукта, которой нет.
    # Проверено здесь же: с `C.UTF-8` те же имена заводятся без единой ошибки.
    env:
      LC_ALL: C.UTF-8
      LANG: C.UTF-8
    concurrency:
      group: zapiski-preflight-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Установить pnpm
        uses: pnpm/action-setup@v4

      - name: Установить Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Встроенный кэш actions/setup-node падает, пока нет pnpm-lock.yaml,
      # поэтому кэшируем store вручную: ключ без лок-файла тоже валиден.
      - name: Кэш pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: pnpm-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Установка зависимостей
        run: |
          set -euo pipefail
          pnpm config set store-dir ~/.pnpm-store
          # Устаревший лок-файл роняет сборку на ПЕРВОМ шаге, до единой строчки
          # полезной работы, и в логе это выглядит как «сборка упала» — причину
          # видно только в середине лога. Так была потеряна не одна выкладка.
          # Поэтому: строгий режим сначала, при расхождении — продолжаем
          # с громким предупреждением и точной подсказкой, чем чинить.
          if [ ! -f pnpm-lock.yaml ]; then
            echo "::notice::pnpm-lock.yaml ещё нет — ставим без --frozen-lockfile"
            pnpm install --no-frozen-lockfile
          elif pnpm install --frozen-lockfile; then
            echo 'Лок-файл актуален.'
          else
            echo "::warning title=Лок-файл устарел::pnpm-lock.yaml разошёлся с package.json. Выполните «pnpm install» и закоммитьте pnpm-lock.yaml. Сейчас ставим без --frozen-lockfile."
            pnpm install --no-frozen-lockfile
          fi

      # Какие скрипты РЕАЛЬНО объявлены в воркспейсе. Шаги ниже включаются
      # по этим флагам, а не по `|| echo`, — так настоящая ошибка не спрячется.
      - name: Определить состав воркспейса
        id: scripts
        run: |
          set -euo pipefail
          node - >> "$GITHUB_OUTPUT" <<'NODE'
          const fs = require('fs');
          const path = require('path');

          const dirs = [];
          for (const root of ['packages', 'apps']) {
            if (!fs.existsSync(root)) continue;
            for (const e of fs.readdirSync(root, { withFileTypes: true })) {
              if (e.isDirectory()) dirs.push(path.join(root, e.name));
            }
          }
          if (fs.existsSync('server')) dirs.push('server');

          const read = (p) =>
            fs.existsSync(p) ? JSON.parse(fs.readFileSync(p, 'utf8')) : null;

          const scripts = new Set();
          for (const d of dirs) {
            const pkg = read(path.join(d, 'package.json'));
            if (!pkg) continue;
            for (const s of Object.keys(pkg.scripts || {})) scripts.add(s);
          }

          const web = read('apps/web/package.json');
          const webBuildable = Boolean(web && web.name && (web.scripts || {}).build);

          const out = [
            `typecheck=${scripts.has('typecheck')}`,
            `test=${scripts.has('test')}`,
            `web_buildable=${webBuildable}`,
            `web_pkg=${webBuildable ? web.name : ''}`,
            `tokens_lint=${fs.existsSync('scripts/lint-tokens.mjs')}`,
          ];
          console.log(out.join('\n'));
          NODE
          echo "--- определено ---"
          cat "$GITHUB_OUTPUT"

      - name: Проверка типов
        if: steps.scripts.outputs.typecheck == 'true'
        run: pnpm -r typecheck

      # ARCHITECTURE §3.4: «ни одного hex вне токенов», проверяется в CI.
      - name: Линт токенов
        if: steps.scripts.outputs.tokens_lint == 'true'
        run: pnpm run lint:tokens

      - name: Тесты
        if: steps.scripts.outputs.test == 'true'
        run: pnpm -r test

      # `имя...` — собрать пакет вместе с его зависимостями по графу
      # воркспейса, то есть packages/* соберутся сами и в правильном порядке.
      - name: Сборка PWA
        if: steps.scripts.outputs.web_buildable == 'true'
        run: pnpm --filter "${{ steps.scripts.outputs.web_pkg }}..." build

      # Токены обязаны совпадать с эталоном дизайна (docs/design/zapiski.css) —
      # он приоритетнее любого текста спецификации. Сравниваются вычисленные
      # значения в браузере: между файлом и экраном стоят каскад и порядок
      # импортов, и расходится именно там. Без браузера шаг пропускает себя сам.
      - name: Токены против эталона дизайна
        if: steps.scripts.outputs.web_buildable == 'true'
        run: node scripts/check-design-tokens.mjs

      # Одно кольцо фокуса на поле (REBUILD §1.5): правила из разных пакетов
      # складываются только на экране. Без браузера шаг пропускает себя сам.
      - name: Одно кольцо фокуса
        if: steps.scripts.outputs.web_buildable == 'true'
        run: node scripts/check-focus-ring.mjs

      # Размеры отрисованных элементов против эталона (REBUILD §3): токен может
      # быть верным, а к элементу приложен не тот. Без браузера шаг пропускает
      # себя сам.
      - name: Размеры против эталона
        if: steps.scripts.outputs.web_buildable == 'true'
        run: node scripts/check-measurements.mjs

      # Сквозной прогон живого приложения. Он здесь потому, что модульные тесты
      # идут в happy-dom, где нет ни раскладки, ни обрезания по overflow, ни
      # вьюпорта, ни тач-событий, — и целый класс отказов проходит мимо них.
      # Так и вышло: меню панели форматирования исправно появлялось в дереве и
      # не появлялось на экране; под тысячу тестов молчали, а заказчик увидел
      # «при клике ничего не открывается» на телефоне и на планшете сразу.
      #
      # `--strict` обязателен. Без него прогон при любой нехватке — нет
      # браузера, нет статики, не поднялся сервер — печатает «ПРОПУЩЕН» и
      # возвращает НОЛЬ, то есть выдаёт зелёный свет, ничего не проверив.
      - name: Живой браузер — сквозной прогон
        if: steps.scripts.outputs.web_buildable == 'true'
        run: node scripts/walkthrough.mjs --strict

      - name: Живой браузер — горячие клавиши
        if: steps.scripts.outputs.web_buildable == 'true'
        run: node scripts/check-hotkeys.mjs --strict

      # Ширина экранов на телефонных вьюпортах (320, 360, 412 и планшет).
      # Заказчик прислал с Android «текст не подстраивается под ширину экрана,
      # меню не влазит» и «в Настройках экраны также не адаптируются»: экран
      # редактора был 464 px при устройстве 360, а разделы настроек прятались
      # за горизонтальной лентой без полосы прокрутки. В happy-dom раскладки
      # нет вовсе, поэтому ловится это только настоящим браузером.
      - name: Живой браузер — ширина экранов
        if: steps.scripts.outputs.web_buildable == 'true'
        run: node scripts/check-viewport-fit.mjs --strict

      # Экран входа: логотип Яндекса обязан ЗАГРУЗИТЬСЯ, а не просто иметь
      # адрес, и разговора о тарифах на бесплатном продукте быть не должно.
      # В happy-dom картинки не грузятся вовсе — дефект «пустое место на
      # кнопке входа» проходил мимо всех тестов и достался заказчику.
      - name: Живой браузер — экран входа
        if: steps.scripts.outputs.web_buildable == 'true'
        run: node scripts/check-signin-screen.mjs --strict

      # Шифрование целиком: пароль → замок → подсказка → биометрия → смена
      # пароля → снятие. Все шесть дефектов этой области жили в ПУТЯХ, а не в
      # контроллере, и потому не были видны ни одному модульному тесту.
      - name: Живой браузер — шифрование
        if: steps.scripts.outputs.web_buildable == 'true'
        run: node scripts/check-encryption.mjs --strict

      # Обратная связь беты: дорога к форме идёт нажатиями («Настройки → О
      # приложении»), а модульные тесты её не проходят — они зовут метод. Так
      # уже пропала Справка: экран был готов, покрыт тестом и никуда не
      # подключён. Плюс блок «Что будет отправлено» несёт главное обещание
      # формы — «ни строчки из ваших заметок», — а «есть в дереве» и «видно на
      # экране» в happy-dom неразличимы.
      - name: Живой браузер — обратная связь
        if: steps.scripts.outputs.web_buildable == 'true'
        run: node scripts/check-feedback-form.mjs --strict

      # Картинки в заметке обязаны стоять рядом, пока помещаются по ширине.
      # Модульные тесты видят документ, а «в ряд» от «столбиком» отличает только
      # раскладка: в happy-dom нет ни ширин, ни переносов — и прогон уже поймал
      # на этом меня, зелёные тесты при картинках столбиком.
      - name: Живой браузер — ряд картинок
        if: steps.scripts.outputs.web_buildable == 'true'
        run: node scripts/check-image-row.mjs --strict

      # Таблица из чужого `.md`. Заказчик прислал скриншот «как коряво
      # открылась таблица» — разметка при этом разбиралась верно, расползалась
      # раскладка. «Таблица есть в дереве» и «колонки стоят ровно» — разные
      # утверждения, и различает их только настоящий браузер: в happy-dom нет
      # ни ширин, ни переносов, ни правой кромки колонки.
      - name: Живой браузер — показ таблицы
        if: steps.scripts.outputs.web_buildable == 'true'
        run: node scripts/check-table-render.mjs --strict

      # Перетаскивание папки и файла .md в библиотеке. Половина требования —
      # про экран: «должно подсвечиваться, куда сейчас перетягиваю». Атрибут в
      # дереве и правило обводки живут в разных пакетах и складываются только
      # в браузере, а модульные тесты видят лишь атрибут.
      - name: Живой браузер — перетаскивание
        if: steps.scripts.outputs.web_buildable == 'true'
        run: node scripts/check-drag-drop.mjs --strict

      # Расход памяти на настоящем хранилище из 800 заметок. Заведён по отказу
      # «открытый сайт в Chrome занимает 804 МБ»: индекс поиска держал текст
      # деревом строковых склеек V8, и корпус в 2 МБ стоил 78 МБ кучи. Ни один
      # модульный тест этого не видит — ни happy-dom, ни куча node не считают
      # строки так, как их считает движок браузера.
      - name: Живой браузер — память
        if: steps.scripts.outputs.web_buildable == 'true'
        run: node scripts/check-memory.mjs --strict

      # Ширина панелей мышью (просьба заказчика): курсор над границей —
      # системный col-resize, перетаскивание меняет ширину, ширина переживает
      # перезагрузку. Ни одно из трёх не видно ни одному модульному тесту:
      # правило курсора живёт в CSS, класс ставит компонент, а ширина панели
      # существует только в раскладке.
      - name: Живой браузер — ширина панелей
        if: steps.scripts.outputs.web_buildable == 'true'
        run: node scripts/check-panes.mjs --strict

      # Корзина в узкой колонке (заказчик: «Корзина выглядит ужасно»):
      # заголовок шапки виден целиком, метастрока укладывается в одну строку и
      # не съедает дату, «Восстановить» не занимает полстроки. Ни одно из
      # утверждений не видно модульным тестам: в happy-dom нет ни ширины
      # колонки, ни переноса, ни обрезания.
      - name: Живой браузер — корзина
        if: steps.scripts.outputs.web_buildable == 'true'
        run: node scripts/check-trash.mjs --strict

      # Начертания пальцем (заказчик: «нет кнопок зачёркнутый, подчёркнутый и
      # италик… но это Android не помогает»): на выделении средний блок панели
      # подменяется на B · I · U · S, каждая кнопка видна целиком, не перекрыта
      # и срабатывает с ОДНОГО касания. Модульные тесты этого не видят: команды
      # существовали и раньше, не существовало пути к ним на телефоне.
      - name: Живой браузер — начертания
        if: steps.scripts.outputs.web_buildable == 'true'
        run: node scripts/check-inline-format.mjs --strict

      # Кнопки «Скачать» на промостранице обязаны указывать на файлы, которые
      # workflow'ы Android и Windows действительно кладут в updates/latest.
      # Имя живёт в HTML и в YAML сразу, и переименование в одном месте делало
      # ссылку 404 — молча, потому что страница при этом собирается.
      - name: Ссылки промостраницы против выкладки
        run: node scripts/check-promo-links.mjs

      # Политика безопасности оболочек не должна убивать стили редактора.
      # Браузером это не поймать: связка «HTML + Tauri» существует только на
      # устройстве, а веб-сборка такой политики не получает — поэтому дефект и
      # прожил столько релизов. Один инлайновый <style> в HTML заставлял Tauri
      # добавить nonce в `style-src`, nonce отменял 'unsafe-inline', и на
      # Android умирало всё оформление CodeMirror и панели форматирования.
      # Проверка статическая и без браузера, поэтому идёт безусловно.
      - name: CSP оболочек против стилей редактора
        run: node scripts/check-csp.mjs

      # Своя строка заголовка не должна соседствовать с системной: плагин
      # состояния окна восстанавливает StateFlags::all(), включая DECORATIONS,
      # поверх `"decorations": false` из конфига. Видно это только у тех, кто
      # обновился с прежней версии, — то есть никогда у проверяющих.
      - name: Хром окна — одна строка заголовка
        run: node scripts/check-window-chrome.mjs

      # Свернуть, закрыть, развернуть и потащить окно — команды ядра Tauri, и
      # каждая проходит проверку прав из capabilities. Набор `core:default`
      # даёт по окну ТОЛЬКО чтение состояния, поэтому без явных прав кнопки
      # молча ничего не делают: промис отвергнут, `void` его проглатывает, на
      # экране — ничего. Ровно так окно и «не сворачивалось» на Windows, и
      # поймать это можно только чтением файла прав: сборка проходит, типы
      # сходятся, тесты зелёные.
      - name: Права на управление окном
        run: node scripts/check-window-permissions.mjs

      # Compose-файл — такой же артефакт, как код: битый YAML обнаружится
      # здесь, а не на проде в момент `up -d`.
      - name: Проверить deploy/docker-compose.yml
        run: |
          set -euo pipefail
          # Значение существует ровно на время валидации и никуда не уезжает:
          # compose обязан видеть переменную, иначе `${VAR:?}` прервёт разбор.
          export ZAPISKI_DB_PASSWORD="$(openssl rand -hex 16)"
          touch deploy/.env
          docker compose --file deploy/docker-compose.yml config --quiet
          rm -f deploy/.env
          echo 'deploy/docker-compose.yml валиден.'

      - name: Проверить синтаксис vhost
        run: |
          set -euo pipefail
          docker run --rm \
            -v "${PWD}/deploy/zapiski.cmpas.ru.nginx.conf:/etc/nginx/conf.d/zapiski.conf:ro" \
            nginx:stable-alpine nginx -t

      # Скрипты уезжают на сервер и исполняются там, где чинить их дорого,
      # поэтому синтаксис проверяем здесь. Оба лежат в deploy/ и доставляются
      # одним и тем же rsync'ом.
      - name: Проверить скрипты, исполняемые на сервере
        run: |
          set -euo pipefail
          bash -n deploy/deploy-production-remote.sh
          bash -n deploy/merge-update-manifest.sh
          echo 'Скрипты деплоя синтаксически валидны.'

      # Артефакт с собранной статикой здесь НЕ выгружается.
      # Раньше выгружался, чтобы передать dist в job deploy, — и деплой
      # падал на `Artifact storage quota has been hit`: сборка проходила,
      # а выкладка срывалась из-за исчерпанной квоты хранилища аккаунта.
      # Job deploy собирает статику сам: веб-сборка занимает секунды, и это
      # дешевле, чем зависеть от общей на весь аккаунт квоты.

  # ───────────────────────────────────────────────────────────────────────────
  # DEPLOY
  # ───────────────────────────────────────────────────────────────────────────
  deploy:
    name: Выкладка на cmpas.ru
    # Ветка по умолчанию берётся из репозитория, а не зашита как `main`:
    # репозиторий был создан пустым, и веткой по умолчанию стала первая
    # запушенная. Жёсткое `refs/heads/main` молча пропускало весь job.
    # Ручной запуск разрешён — им пользуются для первой выкладки.
    if: >-
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
      && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Общая группа с provision-zapiski.yml: сервер трогает кто-то один.
    # cancel-in-progress: false — начатую выкладку на прод не обрывают.
    concurrency:
      group: zapiski-server
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Статика собирается здесь, а не приезжает артефактом из preflight:
      # квота на артефакты общая для всего аккаунта и уже упиралась в потолок,
      # роняя выкладку при полностью зелёной сборке. Веб собирается за секунды.
      # Провал сборки не отменяет деплой API — ниже стоит проверка на пустой
      # dist, и в этом случае docroot просто не трогается.
      - name: Установить pnpm
        uses: pnpm/action-setup@v4

      - name: Установить Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Кэш pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: pnpm-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Собрать PWA
        id: dist
        continue-on-error: true
        run: |
          set -euo pipefail
          [ -d apps/web ] || { echo '::notice::apps/web нет — статику не собираем'; exit 0; }
          if ! pnpm install --frozen-lockfile; then
            echo "::warning title=Лок-файл устарел::pnpm-lock.yaml разошёлся с package.json. Выполните «pnpm install» и закоммитьте pnpm-lock.yaml."
            pnpm install --no-frozen-lockfile
          fi
          # `@zapiski/web...` (с многоточием) — собрать пакет ВМЕСТЕ с его
          # зависимостями по графу воркспейса и в правильном порядке, ровно как
          # в preflight. Без многоточия сборка веба зависела бы от того, что
          # packages/* уже собраны, а в чистом чекауте это не так.
          pnpm --filter "@zapiski/web..." build

      # ── Первое обращение к серверу, и оно обязано объяснять отказ ──────────
      #
      # Прежняя редакция звала `ssh-keyscan … 2>/dev/null` под `set -e`: если
      # сервер не отвечал, объяснение выбрасывалось, а шаг падал. Выкладка
      # вставала с сообщением «Загрузить SSH-ключ: failure» и ни словом о том,
      # что случилось, — и разбираться приходилось гаданием. Ровно это и
      # произошло: две выкладки подряд упали здесь, а причина не была названа
      # ни разу.
      #
      # Имя и адрес сервера в вывод НЕ попадают: имя — секрет, адрес выдал бы
      # его не хуже. Печатаются только классы отказа, и их достаточно, чтобы
      # понять, куда идти: не разрешается имя — вопрос к DNS; молчат все порты
      # — машина не поднята; отвечает 443, но не 22 — жив веб, лёг SSH.
      - name: Загрузить SSH-ключ
        timeout-minutes: 3
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          # Не `-e`: шаг обязан договорить до конца, а не оборваться на первой
          # неудачной проверке. Отказ объявляется явным `exit 1`.
          set -uo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "${SSH_PRIVATE_KEY}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          hide() {
            sed -E "s/${SERVER_HOST}/<хост скрыт>/g; s/[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+/<адрес скрыт>/g"
          }

          if ! getent hosts "${SERVER_HOST}" >/dev/null 2>&1; then
            echo '::error title=Сервер недостижим::Имя сервера не разрешается в адрес — дальше идти некуда. Проверяйте DNS, а не выкладку.'
            exit 1
          fi
          echo 'имя сервера разрешается'

          scan="$(ssh-keyscan -T 15 -H "${SERVER_HOST}" 2>&1)"
          keys="$(printf '%s\n' "${scan}" | grep -cv '^#' || true)"

          if [ "${keys}" -gt 0 ]; then
            printf '%s\n' "${scan}" | grep -v '^#' >> ~/.ssh/known_hosts
            echo "ключей хоста получено: ${keys}"
            exit 0
          fi

          echo '::error title=Сервер недостижим::ssh-keyscan не получил ключа за 15 секунд.'
          echo '── что ответил ssh-keyscan ──'
          printf '%s\n' "${scan}" | hide | tail -5
          echo '── какие порты вообще отвечают ──'
          for port in 22 80 443; do
            if timeout 5 bash -c "exec 3<>/dev/tcp/${SERVER_HOST}/${port}" 2>/dev/null; then
              echo "порт ${port}: отвечает"
            else
              echo "порт ${port}: молчит"
            fi
          done
          echo 'Молчат все три — машина не поднята. Отвечает 443, молчит 22 — жив веб, лёг SSH.'
          exit 1

      - name: Проверить, что провижн уже выполнен
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key \
            "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          missing=0
          [ -d /var/www/zapiski.cmpas.ru ] || { echo 'нет /var/www/zapiski.cmpas.ru' >&2; missing=1; }
          # Проверяем каталог, а НЕ наличие .git: код приезжает rsync'ом
          # с раннера, репозиторием этот каталог не является (см. коммит
          # «Доставлять код API rsync'ом вместо клонирования на сервере»).
          [ -d /var/www/zapiski ]          || { echo 'нет каталога /var/www/zapiski' >&2; missing=1; }
          if [ "$missing" -ne 0 ]; then
            echo 'Сначала запустите workflow «Провижн zapiski.cmpas.ru» (см. deploy/SETUP.md).' >&2
            exit 1
          fi
          mkdir -p /var/www/zapiski.cmpas.ru/updates
          echo 'Провижн на месте.'
          REMOTE

      # ADR-0003 §1: пишем ровно в свой docroot.
      # --delete держит docroot равным сборке, но `updates/` исключён —
      # там лежат подписанные .msi/.apk и latest.json, выкладываемые
      # релизным пайплайном, и обычный деплой веба не должен их сносить.
      # `.well-known/` исключён, чтобы не мешать проверкам certbot.
      - name: Выложить статику PWA
        run: |
          set -euo pipefail
          if [ -d apps/web/dist ] && [ -n "$(ls -A apps/web/dist 2>/dev/null)" ]; then
            rsync -az --delete \
              --exclude 'updates/' \
              --exclude '.well-known/' \
              -e "ssh -i ~/.ssh/deploy_key" \
              apps/web/dist/ \
              "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/var/www/zapiski.cmpas.ru/"
            echo 'Статика выложена.'
          else
            echo "::notice::apps/web/dist пуст или отсутствует — статика не выкладывается, docroot не изменён"
          fi

      # `.well-known/` исключён из выкладки выше НАМЕРЕННО: там же лежат ответы
      # certbot на проверку домена, и `--delete` стирал бы их при каждой
      # выкладке, ломая продление сертификата. Поэтому файл подтверждения для
      # Android App Links едет отдельно и без удаления — рядом с чужими
      # файлами, ничего не трогая.
      - name: Выложить подтверждение App Links
        run: |
          set -euo pipefail
          file=apps/web/dist/.well-known/assetlinks.json
          if [ ! -s "${file}" ]; then
            echo '::error::apps/web/dist/.well-known/assetlinks.json не собран — вход по ссылке на Android откроет браузер'
            exit 1
          fi
          ssh -i ~/.ssh/deploy_key \
            "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" \
            'mkdir -p /var/www/zapiski.cmpas.ru/.well-known'
          rsync -az -e "ssh -i ~/.ssh/deploy_key" \
            "${file}" \
            "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/var/www/zapiski.cmpas.ru/.well-known/assetlinks.json"
          echo 'assetlinks.json выложен.'

      - name: Доставить код API на сервер
        # Вместо git pull на сервере. Репозиторий приватный, и клонирование
        # потребовало бы постоянного deploy key на машине; rsync с раннера
        # обходится без него — на сервере не остаётся доступа к GitHub.
        #
        # Едут только два каталога: deploy/ (compose, скрипт, Dockerfile) и
        # server/ (исходники API, которые собирает docker build). Каталог
        # deploy/.env на сервере НЕ трогаем: в нём сгенерированные пароль базы
        # и AUTH_SECRET, потеря которых оторвала бы стек от существующего тома
        # с данными.
        run: |
          set -euo pipefail
          for dir in deploy server; do
            ssh -i ~/.ssh/deploy_key \
              "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" \
              "mkdir -p /var/www/zapiski/${dir}"
            rsync -az --delete \
              --exclude 'node_modules/' --exclude 'dist/' --exclude '.env' \
              -e "ssh -i ~/.ssh/deploy_key" \
              "${dir}/" \
              "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/var/www/zapiski/${dir}/"
          done
          echo 'Код API доставлен в /var/www/zapiski.'

      # ── Журнал ДО перезапуска ─────────────────────────────────────────────
      #
      # `docker compose logs` показывает логи ТЕКУЩЕГО контейнера, а деплой его
      # пересоздаёт — вместе со всей историей. Шаг диагностики, стоящий после
      # выкладки, поэтому честно печатал «переходов по ссылке в логах нет» даже
      # когда переходы были: он смотрел в контейнер, который живёт двадцать
      # секунд. Всё, что нужно знать о прошлом, читается здесь — до подъёма.
      - name: Что было до выкладки
        continue-on-error: true
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key \
            "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" \
            'bash -s' <<'REMOTE'
          set -uo pipefail
          dc() { docker compose --project-name zapiski --file /var/www/zapiski/deploy/docker-compose.yml "$@"; }

          echo "── вход по ссылке: что записал API за последние сутки ──"
          dc logs --since 24h api 2>/dev/null \
            | grep -E 'magic_link_issued|magic_link_exchanged|magic_link_send_failed|mail_relay' \
            | tail -20 \
            || echo "записей о входе по ссылке нет"

          echo "── переходы по ссылке из письма (код ответа) ──"
          dc logs --since 24h api 2>/dev/null | grep 'magic-link/callback' | tail -10 \
            || echo "переходов в логах нет"
          REMOTE

      - name: Поднять API-стек на сервере
        env:
          # Секреты приходят из GitHub Secrets, уезжают в окружение удалённой
          # сессии, а оттуда — в deploy/.env скриптом деплоя. В лог не
          # печатаются никогда: deploy-production-remote.sh пишет только имя
          # ключа, но не значение.
          YANDEX_CLIENT_ID: ${{ secrets.YANDEX_CLIENT_ID }}
          YANDEX_CLIENT_SECRET: ${{ secrets.YANDEX_CLIENT_SECRET }}
          # Т-Банк: имена ровно те, что заказчик завёл в секретах репозитория.
          TINKOFF_TERMINAL_KEY: ${{ secrets.TINKOFF_TERMINAL_KEY }}
          TINKOFF_PASSWORD: ${{ secrets.TINKOFF_PASSWORD }}
        run: |
          set -euo pipefail
          # Секреты уезжают одним base64-блобом, а не отдельными аргументами.
          # Две причины:
          #   1) значение попадает в удалённую командную строку, и апостроф
          #      или `;` внутри него иначе исполнился бы как код — после
          #      base64 в аргументе остаётся только [A-Za-z0-9+/=];
          #   2) пустой аргумент схлопывается при склейке ssh-команды, и
          #      незаданный ID сдвинул бы SECRET на его место. Один блоб
          #      непустой всегда, поэтому позиции не разъезжаются.
          payload_b64="$(printf 'YANDEX_CLIENT_ID=%s\nYANDEX_CLIENT_SECRET=%s\nTINKOFF_TERMINAL_KEY=%s\nTINKOFF_PASSWORD=%s\n' \
            "${YANDEX_CLIENT_ID}" "${YANDEX_CLIENT_SECRET}" \
            "${TINKOFF_TERMINAL_KEY}" "${TINKOFF_PASSWORD}" | base64 -w0)"

          ssh -i ~/.ssh/deploy_key \
            "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" \
            'bash -s' -- "${payload_b64}" <<'REMOTE'
          set -Eeuo pipefail

          # export "$k=$v" без eval: значение секрета не интерпретируется.
          while IFS='=' read -r k v; do
            if [ -n "${k}" ]; then export "${k}=${v}"; fi
          done <<< "$(printf '%s' "${1:-}" | base64 -d)"

          # ADR-0003 §3: работаем только в своём каталоге.
          cd /var/www/zapiski

          # Здесь раньше стояли `git fetch` и `git reset --hard origin/main` —
          # наследство схемы «клонируем репозиторий на сервер». Код приезжает
          # rsync'ом шагом выше, каталог репозиторием НЕ является, поэтому
          # git-команды падали с «not a git repository» и роняли весь шаг.
          # Заодно `origin/main` снова зашивал ветку `main`, которой в этом
          # репозитории нет. Вместо них — проверка, что rsync реально доехал.
          for required in deploy/docker-compose.yml deploy/deploy-production-remote.sh server/package.json; do
            [ -f "${required}" ] || {
              echo "нет ${required} в /var/www/zapiski — шаг доставки кода не отработал" >&2
              exit 1
            }
          done

          set +e
          bash deploy/deploy-production-remote.sh 2>&1 | tee /tmp/zapiski-deploy.log
          status=${PIPESTATUS[0]}
          exit "${status}"
          REMOTE

      # ── Почта: жива ли она на самом деле ───────────────────────────────
      #
      # Заказчик: «вход через почту не работает». Проверить это можно только с
      # сервера: релей слушает 25 на хосте, снаружи туда не достучаться, а
      # приложение видит лишь «письмо отправить не удалось».
      #
      # Шаг НЕ роняет выкладку: почта живёт в чужом compose-проекте
      # (/var/www/cmpas.ru), и класть из-за неё релиз API нельзя. Он называет
      # причину — этого не хватало ровно всё время, пока «не работает вход».
      # ── Почта: жива ли она на самом деле ───────────────────────────────
      #
      # Заказчик: «вход через почту не работает». Проверить это можно только с
      # сервера: релей слушает 25 на хосте, снаружи туда не достучаться, а
      # приложение видит лишь «письмо отправить не удалось».
      #
      # Шаг НЕ роняет выкладку: почта живёт в чужом compose-проекте
      # (/var/www/cmpas.ru), и класть из-за неё релиз API нельзя.
      #
      # Compose зовётся С ИМЕНЕМ ПРОЕКТА И ФАЙЛОМ — ровно как в
      # `deploy-production-remote.sh`. Первая версия шага звала голый
      # `docker compose`, получала «no configuration file provided» и
      # рапортовала «контейнер API до релея не достучался»: жалоба на сеть
      # вместо жалобы на команду. Ошибка того же класса, что ловит этот шаг.
      - name: Проверить почту и возврат после входа
        if: always()
        continue-on-error: true
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key \
            "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" \
            'bash -s' <<'REMOTE'
          set -uo pipefail
          dc() { docker compose --project-name zapiski --file /var/www/zapiski/deploy/docker-compose.yml "$@"; }

          echo "── что слушает 25-й порт ──"
          (ss -lntp 2>/dev/null || netstat -lntp 2>/dev/null) | grep -E '[:.]25\s' || echo "на 25 никто не слушает"

          echo "── адрес шлюза docker0 ──"
          ip -4 addr show docker0 2>/dev/null | awk '/inet /{print "docker0: " $2}' || echo "docker0 не найден"

          echo "── разговор с релеем из контейнера API ──"
          # Сначала СЫРОЙ разговор, по правилам SMTP: сперва дождаться
          # приветствия «220», и только потом слать EHLO. Прошлый заход слал
          # EHLO сразу по установке TCP — postfix честно ответил «554 Error:
          # SMTP protocol synchronization», и это был отказ МОЕЙ пробе, а не
          # признак сломанного релея. Проба, нарушающая протокол, обвиняет не
          # того.
          #
          # `< /dev/null` обязателен: `docker compose exec` читает stdin, а
          # stdin здесь — сам этот скрипт, приехавший в `bash -s`. Без него
          # exec съедал остаток скрипта, и всё, что ниже, просто не
          # выполнялось — в прошлом прогоне так пропали и health, и логи.
          dc exec -T api node -e '
            const net = require("net");
            const host = process.env.SMTP_HOST, port = Number(process.env.SMTP_PORT);
            const sock = net.connect({ host, port, timeout: 8000 });
            let log = "", greeted = false, done = false;
            sock.setEncoding("utf8");
            sock.on("data", (chunk) => {
              log += chunk;
              if (done) return;
              if (!greeted && /^220[ -]/.test(log)) { greeted = true; sock.write("EHLO zapiski.cmpas.ru\r\n"); return; }
              // `done` обязателен: без него добравшая порция данных заставляла
              // писать QUIT во второй раз, уже в закрытый сокет, и проба
              // рапортовала ERR_STREAM_WRITE_AFTER_END при полностью живом
              // релее. Сторож, пугающий на исправном, — тоже неисправный сторож.
              if (greeted && /\r\n(250|[45]\d\d) /.test(log)) { done = true; sock.write("QUIT\r\n"); sock.end(); }
            });
            sock.on("close", () => {
              console.log(`SMTP ${host}:${port} ответил:`);
              console.log(log.trim() || "(молчание)");
              process.exit(/\r\n250 |^250 /m.test(log) ? 0 : 1);
            });
            sock.on("timeout", () => { console.log(`SMTP ${host}:${port} — молчит (таймаут)`); process.exit(1); });
            sock.on("error", (e) => { console.log(`SMTP ${host}:${port} — ${e.code ?? e.message}`); process.exit(1); });
          ' < /dev/null || echo "релей не принял разговор — смотрите ответ выше"

          echo "── что об этом релее думает сам nodemailer ──"
          # Разговор выше может пройти, а письмо всё равно не уйти: письма
          # отправляет nodemailer, и спотыкается он там, куда сырая проба не
          # доходит, — на STARTTLS. Спрашиваем ровно тот код, который работает
          # в продукте, и в трёх настройках сразу, чтобы одним заходом знать
          # не только «сломано», но и «чем чинится».
          dc exec -T api node -e '
            const nodemailer = require("nodemailer");
            const host = process.env.SMTP_HOST, port = Number(process.env.SMTP_PORT);
            const local = String(process.env.SMTP_LOCAL_RELAY) === "true";
            const modes = [
              ["как настроен сейчас", local ? { opportunisticTLS: true, tls: { rejectUnauthorized: false } } : {}],
              ["строго, с проверкой сертификата", {}],
              ["сертификат не проверяем", { opportunisticTLS: true, tls: { rejectUnauthorized: false } }],
              ["STARTTLS выключен вовсе", { ignoreTLS: true }],
            ];
            (async () => {
              for (const [name, extra] of modes) {
                const transport = nodemailer.createTransport({
                  host, port, secure: false,
                  connectionTimeout: 8000, greetingTimeout: 8000, socketTimeout: 8000,
                  ...extra,
                });
                try {
                  await transport.verify();
                  console.log(`${name}: письма уйдут`);
                } catch (error) {
                  const code = error && error.code ? error.code : "";
                  const text = error && error.message ? error.message : String(error);
                  console.log(`${name}: ОТКАЗ ${code} ${String(text).replace(/\s+/g, " ").slice(0, 200)}`);
                }
              }
            })();
          ' < /dev/null || echo "nodemailer не отчитался"

          echo "── ДОШЛО ЛИ письмо, а не только принял ли релей ──"
          # Это разные вещи, и до сих пор проверялась только первая.
          #
          # `verify()` и сырая проба выше отвечают на вопрос «принял ли релей
          # разговор». Принять он может и потом не доставить: получатель
          # притормозил, обратной зоны нет, письмо ушло в отложенную очередь.
          # Для API это успешная отправка, для человека — «почта не приходит».
          # Различает их только журнал самого релея.
          #
          # Релей чужой: 25-й порт держит соседний проект (ADR-0003 §2, §7).
          # Поэтому ТОЛЬКО ЧТЕНИЕ — `docker logs`, без exec, без правок, без
          # postsuper. Ни одной команды, меняющей его состояние, здесь нет и
          # быть не должно.
          #
          # Адреса вырезаются: в журнале релея они есть, в нашем выводе им не
          # место.
          relay="$(docker ps --format '{{.Names}} {{.Ports}}' | awk '$0 ~ /:25->/ {print $1; exit}')"
          if [ -z "${relay:-}" ]; then
            echo "контейнер релея на 25-м порту не найден — доставку проверить нечем"
          else
            echo "релей: ${relay}"
            docker logs --since 6h "${relay}" 2>&1 \
              | grep -E 'status=(sent|deferred|bounced|expired)' \
              | sed -E 's/<[^>]*>/<адрес скрыт>/g; s/to=[^,]*/to=<адрес скрыт>/g' \
              | tail -12 \
              || echo "за шесть часов релей не отчитывался о доставке"
            echo "── сводка по исходам за шесть часов ──"
            docker logs --since 6h "${relay}" 2>&1 \
              | grep -oE 'status=(sent|deferred|bounced|expired)' \
              | sort | uniq -c \
              || echo "исходов не записано"
          fi

          echo "── что говорит о себе сам API ──"
          curl -sS -m 10 http://127.0.0.1:3100/api/v1/health || echo "health не ответил"
          echo

          echo "── почему API считает почту недоступной ──"
          dc logs --since 72h api 2>/dev/null | grep -i 'mail_relay_unavailable' | tail -3 \
            || echo "причина в логах не записана"

          echo "── последние отказы отправки письма ──"
          dc logs --since 72h api 2>/dev/null | grep -i 'magic_link_send_failed' | tail -5 \
            || echo "отказов отправки в логах нет"

          echo "── куда API возвращает после входа ──"
          # Не секреты: это адреса возврата, они и так видны каждому, кто
          # проходит вход. Смотрим их в ЖИВОМ контейнере, а не в compose-файле:
          # заказчик сообщил, что после ссылки из письма попадает на сайт, а по
          # коду для установленных приложений полагается своя схема. Разойтись
          # эти две картины могут ровно в одном месте — в окружении, с которым
          # контейнер поднялся.
          dc exec -T api sh -lc 'echo "AUTH_SUCCESS_REDIRECT=$AUTH_SUCCESS_REDIRECT"; echo "AUTH_SUCCESS_REDIRECT_APP=$AUTH_SUCCESS_REDIRECT_APP"' \
            < /dev/null || echo "окружение прочитать не удалось"

          echo "── чем кончались переходы по ссылке из письма ──"
          # ЧЕСТНО ПРО ОКНО. `--since 72h` обещает трое суток, а `docker logs`
          # показывает только ТЕКУЩИЙ контейнер — и выкладка его пересоздаёт.
          # То есть сразу после деплоя окно равно возрасту контейнера, обычно
          # секундам. Раз я на этом попался сам, пусть возраст печатается
          # рядом: строка «переходов нет» без него читается как «их не было»,
          # хотя означает «смотреть было негде».
          started="$(dc exec -T api sh -lc 'cat /proc/1/stat >/dev/null 2>&1 && awk "{print int(\$1)}" /proc/uptime' < /dev/null 2>/dev/null || echo '?')"
          echo "возраст контейнера API: ${started} с — журнал старше этого не бывает"
          # Токен в журнале уже скрыт (`sanitizeUrl`), а нужен здесь только код
          # ответа: 302 — увели в приложение, 400 — ссылка не разменялась,
          # 200 — показали страницу. По нему и видно, где обрывается путь.
          dc logs --since 72h api 2>/dev/null | grep -i 'magic-link/callback' | tail -8 \
            || echo "переходов по ссылке в текущем контейнере нет"

          echo "── подтверждение App Links ──"
          curl -sS -m 10 -o /dev/null -w 'assetlinks.json: %{http_code} %{content_type}\n' \
            https://zapiski.cmpas.ru/.well-known/assetlinks.json || echo "assetlinks.json не ответил"

          echo "── с какой платформы просили ссылку (за 3 суток) ──"
          # Журнал контейнера переживает не всякую выкладку, а база переживает
          # любую: платформа записана к самому токену, и именно по ней сервер
          # выбирает адрес возврата. Если android здесь не появляется вовсе —
          # значит приложение платформу не прислало, и человека законно уводят
          # на сайт. Это отличает дефект приложения от дефекта сервера, а по
          # симптому «попал на сайт» они неразличимы.
          #
          # Считаются СТРОКИ, а не адреса: ни почты, ни токенов, ни устройств.
          dc exec -T postgres psql -U zapiski -d zapiski -At -c \
            "SELECT coalesce(platform, 'не указана')
                    || ': выдано ' || count(*)
                    || ', разменяно ' || count(used_at)
               FROM magic_tokens
              WHERE created_at > now() - interval '3 days'
              GROUP BY platform
              ORDER BY count(*) DESC" \
            < /dev/null || echo "база не ответила"

          # `used_at` — единственный долговечный след того, что переход ДОШЁЛ
          # до сервера: он проставляется в момент размена. Ноль разменянных
          # при непустой выдаче означает, что до нас не доехало ни одного
          # перехода, и разбираться надо на устройстве, а не в API.
          REMOTE

      - name: Скачать удалённый лог деплоя
        if: failure()
        continue-on-error: true
        run: |
          mkdir -p deploy-diagnostics
          scp -i ~/.ssh/deploy_key \
            "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/tmp/zapiski-deploy.log" \
            deploy-diagnostics/zapiski-deploy.log

      - name: Приложить диагностику
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: zapiski-deploy-${{ github.sha }}
          path: deploy-diagnostics/**
          if-no-files-found: ignore
          # Квота артефактов общая на весь аккаунт и уже упиралась в потолок
          # (из-за этого деплой падал при зелёной сборке). Здесь выгружается
          # только текстовый лог и только при провале, но срок держим коротким:
          # разбор падения происходит по горячим следам, хранить его две недели
          # незачем.
          retention-days: 7

      - name: Убрать SSH-ключ
        if: always()
        run: rm -f ~/.ssh/deploy_key
