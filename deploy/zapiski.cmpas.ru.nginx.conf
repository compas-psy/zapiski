# /etc/nginx/sites-available/zapiski.cmpas.ru
#
# Отдельный vhost КОМПАС.ЗАПИСКИ на том же сервере, где живёт КОМПАС.Дневник.
# Реализует инварианты изоляции из docs/adr/0003-backend-na-node-i-izolyaciya-na-cmpas-ru.md.
#
# ПОЧЕМУ ЭТОТ ФАЙЛ НЕ МОЖЕТ ЗАДЕТЬ cmpas.ru:
#   * ADR-0003 §1 — маршрутизация идёт по `server_name`. Запрос на cmpas.ru или
#     cmpas.ru/diary матчится vhost'ом Дневника и до этого блока не доходит.
#     Здесь НЕТ `default_server` — добавить его значило бы перехватить чужой
#     трафик, поэтому его нет и быть не должно.
#   * ADR-0003 §1 — свой docroot /var/www/zapiski.cmpas.ru. Ни одного пути
#     из /var/www/cmpas.ru тут не упоминается.
#   * ADR-0003 §2 — единственный proxy_pass ведёт строго на 127.0.0.1:3100.
#     Порт 3000 (Next.js Дневника) и 25 (postfix) в этом файле не встречаются.
#   * ADR-0003 §5 — файл только ДОБАВЛЯЕТСЯ в sites-available; vhost Дневника
#     не читается и не редактируется. Включение проходит через `nginx -t`
#     (см. .github/workflows/provision-zapiski.yml) и откатывается при провале.
#
# certbot --nginx (см. deploy/SETUP.md) сам допишет сюда `listen 443 ssl`,
# `ssl_certificate*` и отдельный server-блок с редиректом http→https.
# Строго `-d zapiski.cmpas.ru`, сертификат Дневника не переоформляется
# (ADR-0003 §6).

# Проброс websocket-рукопожатия для мгновенного синка KompasCloud.
#
# Имя переменной намеренно с префиксом `zapiski_`: `map` — директива http-уровня,
# а два `map` с одинаковым именем переменной в одном http-контексте — это
# `[emerg] duplicate variable name` и падение `nginx -t` для ВСЕГО сервера.
# Если конфиг Дневника когда-нибудь заведёт свой `$connection_upgrade`,
# мы с ним не столкнёмся.
map $http_upgrade $zapiski_connection_upgrade {
    default upgrade;
    ''      close;
}

# Псевдоним notes.cmpas.ru — постоянный редирект на канонический домен.
#
# Два живых домена на одно приложение — источник трудноуловимых поломок:
#   * OAuth Яндекс ID проверяет redirect_uri буквально, и вход, начатый на
#     notes, завершился бы ошибкой несовпадения;
#   * куки сессии, выданные на одном имени, не видны на другом — пользователь
#     «разлогинивается», переходя по ссылке из письма;
#   * magic-ссылка в письме ведёт на один домен, а приложение открыто на
#     другом.
# Поэтому канонический ровно один, второй только направляет на него.
# Поменять канонический — это поменять имена местами здесь и в
# redirect_uri Яндекс ID.
server {
    listen 80;
    listen [::]:80;
    server_name notes.cmpas.ru;

    # 301, а не 302: адрес меняется навсегда, браузеры и поисковики его запомнят.
    # $request_uri сохраняет путь и параметры — ссылка на заметку не потеряется.
    return 301 https://zapiski.cmpas.ru$request_uri;
}

server {
    listen 80;
    listen [::]:80;

    # ADR-0003 §1: собственный домен. Никакого default_server.
    server_name zapiski.cmpas.ru;

    # ADR-0003 §1: собственный docroot, статика PWA.
    root /var/www/zapiski.cmpas.ru;
    index index.html;

    # Загрузка зашифрованных блобов через /api/ (ТЗ §4.1 — «тупая труба»).
    client_max_body_size 64m;

    # Заголовки безопасности. Наследуются во все location'ы, у которых нет
    # собственного add_header: в nginx add_header в дочернем блоке ЗАМЕНЯЕТ
    # весь набор родителя, а не дополняет его. Поэтому ниже эти три строки
    # повторяются в каждом location, где есть свой add_header. Это не копипаста
    # по невнимательности — это единственный способ не потерять их.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               application/manifest+json image/svg+xml;

    # ─────────────────────────────────────────────────────────────────────────
    # API КОМПАС.Облако — ADR-0003 §2
    # ─────────────────────────────────────────────────────────────────────────
    #
    # `^~` вместо простого префикса: так этот location выигрывает у любых
    # regex-location'ов ниже. Без него запрос /api/v1/blob/abc.js попал бы
    # в правило кэширования ассетов и был бы отдан как файл с диска.
    #
    # 127.0.0.1:3100 — контейнер zapiski-api, опубликованный ТОЛЬКО на
    # loopback (см. deploy/docker-compose.yml). Наружу API виден
    # исключительно через этот блок.
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Websocket для мгновенного синка (ТЗ §4.1, SyncBackend.subscribe).
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $zapiski_connection_upgrade;

        # Долгоживущее соединение синка не должно рваться по таймауту.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # Блобы стримим, а не копим в буфере nginx.
        proxy_buffering         off;
        proxy_request_buffering off;

        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    # ─────────────────────────────────────────────────────────────────────────
    # Автообновление desktop/Android
    # ─────────────────────────────────────────────────────────────────────────
    #
    # Файлы кладутся вне rsync-синхронизации статики (deploy-zapiski.yml
    # исключает `updates/`), поэтому релизный бинарник не сносится обычным
    # деплоем веба.
    #
    # try_files ... =404 принципиально: апдейтер должен получить честный 404,
    # а не HTML SPA-фолбэка, иначе он попытается распарсить index.html как
    # манифест обновления.
    location ^~ /updates/ {
        autoindex off;
        try_files $uri =404;

        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;

        # Манифест обновления — всегда свежий, иначе клиент неделю не узнает
        # о релизе.
        location = /updates/latest.json {
            types { }
            default_type application/json;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            try_files $uri =404;
        }

        # Android: без правильного Content-Type установщик пакета не
        # запускается, браузер просто показывает файл.
        # Пустой блок `types { }` гарантирует, что default_type применится
        # даже если в mime.types когда-нибудь появится своя запись для .apk.
        location ~ ^/updates/.+\.apk$ {
            types { }
            default_type application/vnd.android.package-archive;
            add_header Content-Disposition 'attachment' always;
            add_header Cache-Control "public, max-age=3600" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            try_files $uri =404;
        }

        # Windows-инсталлятор, NSIS-архивы и .sig-подписи Tauri.
        location ~ ^/updates/.+\.(msi|exe|zip|tar\.gz|sig)$ {
            types { }
            default_type application/octet-stream;
            add_header Cache-Control "public, max-age=3600" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            try_files $uri =404;
        }
    }

    # ─────────────────────────────────────────────────────────────────────────
    # Кэширование статики PWA
    # ─────────────────────────────────────────────────────────────────────────

    # Vite складывает всё с хешем в имени в /assets/. Имя меняется вместе с
    # содержимым, значит кэш можно держать вечно. Шрифты, попавшие в /assets/,
    # тоже получают год — это правильнее семи дней, имя всё равно хешированное.
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        try_files $uri =404;
    }

    # Шрифты вне /assets/ (нехешированные имена) — неделя.
    location ~* \.woff2?$ {
        expires 7d;
        add_header Cache-Control "public" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    # HTML не кэшируем никогда: он ссылается на хешированные ассеты и обязан
    # обновляться в тот же заход. Сюда же попадает SPA-фолбэк из location /.
    location ~* \.html$ {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    # Service worker и манифест PWA — тоже без кэша, иначе установленное
    # приложение зависает на старой версии.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        types { }
        default_type application/manifest+json;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        try_files $uri =404;
    }

    # ─────────────────────────────────────────────────────────────────────────
    # SPA
    # ─────────────────────────────────────────────────────────────────────────
    #
    # Фолбэк на /index.html делает внутренний редирект, после которого заново
    # проходит подбор location — значит no-cache из `\.html$` применится.
    location / {
        try_files $uri $uri/ /index.html;
    }

    access_log /var/log/nginx/zapiski.cmpas.ru.access.log;
    error_log  /var/log/nginx/zapiski.cmpas.ru.error.log;
}
